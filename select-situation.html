<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>상황 선택 – Sendit</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="select-situation.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet" />
</head>
<body class="page-select">

  <!-- ───────────────────────────── NAV ───────────────────────────── -->
  <header class="nav">
    <div class="nav__inner">
      <div class="nav__left">
        <a href="index.html" class="nav__logo">Sendit</a>
        <nav class="nav__links">
          <a href="index.html#hero"    class="nav__link nav__link--active">이용 상황</a>
          <a href="index.html#how"     class="nav__link">이용 방법</a>
          <a href="index.html#pricing" class="nav__link">가격</a>
          <a href="index.html#faq"     class="nav__link">자주 묻는 질문</a>
          <a href="index.html#trust"   class="nav__link">인증 및 문서</a>
          <a href="index.html#law"     class="nav__link">법 조항</a>
        </nav>
      </div>
      <div class="nav__right">
        <a href="contact.html" class="nav__contact">서비스문의</a>
        <button class="btn btn--dark" onclick="window.location.href='login.html'">로그인</button>
      </div>
    </div>
  </header>

  <!-- ───────────────────────────── MAIN ───────────────────────────── -->
  <main class="situation-main">
    <div class="situation-header">
      <h1 class="situation-title">어떤 상황인가요?</h1>
      <p class="situation-sub">상황에 맞는 템플릿을 선택해 주세요.</p>
    </div>

    <div class="situation-grid">

      <div class="sit-select-card" data-type="임대차">
        <img class="sit-select-icon" src="assets/home.svg" alt="임대차" />
        <div class="sit-select-info">
          <strong class="sit-select-name">임대차</strong>
          <span class="sit-select-desc">보증금 반환, 계약 해지 요청</span>
        </div>
      </div>

      <div class="sit-select-card" data-type="대여금">
        <img class="sit-select-icon" src="assets/money.svg" alt="대여금" />
        <div class="sit-select-info">
          <strong class="sit-select-name">대여금</strong>
          <span class="sit-select-desc">빌려준 돈 회수 요청</span>
        </div>
      </div>

      <div class="sit-select-card" data-type="계약관련">
        <img class="sit-select-icon" src="assets/file.svg" alt="계약관련" />
        <div class="sit-select-info">
          <strong class="sit-select-name">계약관련</strong>
          <span class="sit-select-desc">계약 해지, 위반 통보</span>
        </div>
      </div>

      <div class="sit-select-card" data-type="층간소음">
        <img class="sit-select-icon" src="assets/sound.svg" alt="층간소음" />
        <div class="sit-select-info">
          <strong class="sit-select-name">층간소음</strong>
          <span class="sit-select-desc">층간소음 시정 요청</span>
        </div>
      </div>

      <div class="sit-select-card" data-type="회원권환불">
        <img class="sit-select-icon" src="assets/arrow_reset.svg" alt="회원권 환불" />
        <div class="sit-select-info">
          <strong class="sit-select-name">회원권 환불</strong>
          <span class="sit-select-desc">헬스장, 학원 등 회원권 환불</span>
        </div>
      </div>

      <div class="sit-select-card" data-type="직접작성">
        <img class="sit-select-icon" src="assets/edit.svg" alt="직접 작성" />
        <div class="sit-select-info">
          <strong class="sit-select-name">직접 작성</strong>
          <span class="sit-select-desc">위에 해당하지 않는 경우</span>
        </div>
      </div>

    </div>
  </main>

  <!-- ───────────────────────────── BOTTOM BAR ───────────────────────────── -->
  <div class="bottom-bar">
    <button class="btn-prev" id="btnPrev">이전</button>
  </div>

  <script src="select-situation.js"></script>
</body>
</html>
