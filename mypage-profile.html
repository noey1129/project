<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 정보 – Sendit</title>
  <link href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="mypage.css" />
</head>
<body class="page-mypage">

  <!-- ── Sendit 상단 네비게이션 ── -->
  <header class="nav nav--user">
    <div class="nav__inner">
      <div class="nav__left">
        <a href="index.html" class="nav__logo">Sendit</a>
      </div>
      <div class="nav__right">
        <span class="nav__user-name" id="navUserName">홍길동</span>
        <a href="contact.html" class="nav__contact">서비스문의</a>
        <button class="btn--outline" onclick="window.location.href='login.html'">로그아웃</button>
      </div>
    </div>
  </header>

  <div class="mypage-layout">

    <!-- ── 사이드바 ── -->
    <aside class="mypage-sidebar">
      <div class="mypage-sidebar__profile">
        <span class="mypage-sidebar__name" id="sidebarUserName">홍길동</span>
        <span class="mypage-sidebar__email" id="sidebarUserEmail">user@example.com</span>
      </div>
      <nav class="mypage-sidebar__nav">
        <a href="mypage.html" class="mypage-nav-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
          </svg>
          발송 내역
        </a>
        <a href="mypage-profile.html" class="mypage-nav-item active">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          내 정보
        </a>
      </nav>
      <div class="mypage-sidebar__cta">
        <a href="select-situation.html" class="mypage-new-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          새 내용증명 작성
        </a>
      </div>
    </aside>

    <!-- ── 메인 콘텐츠 ── -->
    <main class="mypage-content">

      <h1 class="mypage-section-title">내 정보 수정</h1>

      <!-- 정보 수정 폼 (Tabler card) -->
      <div class="card" style="border-radius:14px; border:1px solid #E7E9EB; max-width:520px;">
        <div class="card-body" style="padding:28px;">
          <form onsubmit="return false;" id="profileForm">

            <!-- 이름 -->
            <div class="mb-3">
              <label class="form-label" for="profileName" style="font-size:14px; font-weight:600; color:#47494C;">이름</label>
              <input
                type="text"
                class="form-control"
                id="profileName"
                value="홍길동"
                placeholder="이름"
                style="height:48px; font-size:15px; border-radius:8px; background:#F8F9FA; border:1px solid #D7DBDF;"
              />
            </div>

            <!-- 이메일 -->
            <div class="mb-3">
              <label class="form-label" for="profileEmail" style="font-size:14px; font-weight:600; color:#47494C;">이메일</label>
              <input
                type="email"
                class="form-control"
                id="profileEmail"
                value="user@example.com"
                placeholder="이메일"
                style="height:48px; font-size:15px; border-radius:8px; background:#F8F9FA; border:1px solid #D7DBDF;"
              />
            </div>

            <!-- 전화번호 -->
            <div class="mb-3">
              <label class="form-label" for="profilePhone" style="font-size:14px; font-weight:600; color:#47494C;">전화번호</label>
              <input
                type="tel"
                class="form-control"
                id="profilePhone"
                value="010-1234-5678"
                placeholder="전화번호"
                maxlength="13"
                style="height:48px; font-size:15px; border-radius:8px; background:#F8F9FA; border:1px solid #D7DBDF;"
              />
            </div>

            <!-- 구분선 -->
            <hr style="border-top:1px solid #E7E9EB; margin:8px 0 20px;">

            <!-- 현재 비밀번호 -->
            <div class="mb-3">
              <label class="form-label" for="currentPw" style="font-size:14px; font-weight:600; color:#47494C;">현재 비밀번호</label>
              <input
                type="password"
                class="form-control"
                id="currentPw"
                placeholder="현재 비밀번호"
                autocomplete="current-password"
                style="height:48px; font-size:15px; border-radius:8px; background:#F8F9FA; border:1px solid #D7DBDF;"
              />
            </div>

            <!-- 새 비밀번호 -->
            <div class="mb-3">
              <label class="form-label" for="newPw" style="font-size:14px; font-weight:600; color:#47494C;">
                새 비밀번호
                <span style="font-size:12px; font-weight:400; color:#8C8C8C;">(변경 시에만 입력)</span>
              </label>
              <input
                type="password"
                class="form-control"
                id="newPw"
                placeholder="새 비밀번호 (8자 이상)"
                autocomplete="new-password"
                style="height:48px; font-size:15px; border-radius:8px; background:#F8F9FA; border:1px solid #D7DBDF;"
              />
            </div>

            <!-- 새 비밀번호 확인 -->
            <div class="mb-4">
              <label class="form-label" for="newPwConfirm" style="font-size:14px; font-weight:600; color:#47494C;">새 비밀번호 확인</label>
              <input
                type="password"
                class="form-control"
                id="newPwConfirm"
                placeholder="새 비밀번호 확인"
                autocomplete="new-password"
                style="height:48px; font-size:15px; border-radius:8px; background:#F8F9FA; border:1px solid #D7DBDF;"
              />
              <div class="invalid-feedback" id="pwMatchError" style="display:none; color:#E53E3E; font-size:12px; margin-top:6px;">
                비밀번호가 일치하지 않습니다.
              </div>
            </div>

            <!-- 저장 버튼 -->
            <button
              type="button"
              class="btn w-100"
              id="btnSaveProfile"
              style="height:50px; background:#172230; color:#fff; border:none; border-radius:8px; font-size:15px; font-weight:700; font-family:inherit; transition:background 0.2s;"
              onmouseover="this.style.background='#243447'"
              onmouseout="this.style.background='#172230'"
            >
              변경 사항 저장
            </button>

          </form>
        </div>
      </div>

      <!-- 회원 탈퇴 (Danger zone card) -->
      <div class="card" style="border-radius:14px; border:1px solid #FFD7D7; max-width:520px; margin-top:0;">
        <div class="card-body" style="padding:24px 28px;">
          <div class="d-flex align-items-center justify-content-between gap-3">
            <div>
              <div style="font-size:15px; font-weight:700; color:#1C1E21; margin-bottom:4px;">회원 탈퇴</div>
              <div style="font-size:13px; color:#696B6D;">탈퇴 시 모든 발송 내역 및 증명서가 삭제됩니다.</div>
            </div>
            <button
              class="btn btn-sm"
              style="padding:10px 18px; background:#fff; border:1px solid #E53E3E; border-radius:8px; font-size:13px; font-weight:600; color:#C62828; cursor:pointer; font-family:inherit; white-space:nowrap; flex-shrink:0; transition:background 0.15s;"
              onmouseover="this.style.background='#FFF0F0'"
              onmouseout="this.style.background='#fff'"
              onclick="alert('회원 탈퇴 기능은 준비 중입니다.')"
            >
              탈퇴하기
            </button>
          </div>
        </div>
      </div>

    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js"></script>
  <script>
    /* sessionStorage에서 사용자 이름 가져오기 */
    var userName = sessionStorage.getItem('user_name') || '홍길동';
    var userEmail = sessionStorage.getItem('user_email') || 'user@example.com';
    document.getElementById('navUserName').textContent = userName;
    document.getElementById('sidebarUserName').textContent = userName;
    document.getElementById('sidebarUserEmail').textContent = userEmail;

    /* 전화번호 자동 하이픈 */
    document.getElementById('profilePhone').addEventListener('input', function () {
      var v = this.value.replace(/\D/g, '').slice(0, 11);
      if (v.length <= 3) { this.value = v; return; }
      if (v.length <= 7) { this.value = v.slice(0,3) + '-' + v.slice(3); return; }
      this.value = v.slice(0,3) + '-' + v.slice(3,7) + '-' + v.slice(7);
    });

    /* 비밀번호 일치 확인 */
    function checkPwMatch() {
      var nv = document.getElementById('newPw').value;
      var nc = document.getElementById('newPwConfirm').value;
      var errEl = document.getElementById('pwMatchError');
      errEl.style.display = (nc && nv !== nc) ? 'block' : 'none';
    }
    document.getElementById('newPw').addEventListener('input', checkPwMatch);
    document.getElementById('newPwConfirm').addEventListener('input', checkPwMatch);

    /* 저장 버튼 */
    document.getElementById('btnSaveProfile').addEventListener('click', function () {
      alert('정보 수정 기능은 준비 중입니다.');
    });
  </script>

</body>
</html>
