<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 정보 – Sendit</title>
  <link rel="stylesheet" href="mypage.css" />
</head>
<body class="page-mypage">

<div class="mypage-wrap">

  <!-- ── 사이드바 ── -->
  <aside class="mypage-sidebar">
    <a href="mypage.html" class="mypage-sidebar__logo">Sendit</a>
    <div class="mypage-sidebar__profile">
      <span class="mypage-sidebar__name" id="sidebarUserName">홍길동</span>
      <span class="mypage-sidebar__email" id="sidebarUserEmail">user@example.com</span>
    </div>
    <div style="padding:12px 12px 0;">
      <a href="select-situation.html" class="mypage-new-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        새 내용증명 작성
      </a>
    </div>
    <nav class="mypage-sidebar__nav">
      <a href="mypage.html" class="mypage-nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
        </svg>
        발송 내역
      </a>
      <a href="mypage-profile.html" class="mypage-nav-item active">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
        내 정보
      </a>
    </nav>
    <div class="mypage-sidebar__footer">
      <button class="mypage-logout-btn" onclick="sessionStorage.removeItem('logged_in'); sessionStorage.removeItem('user_name'); sessionStorage.removeItem('user_email'); window.location.href='login.html';">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M14 8v-2a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2v-2"/><path d="M9 12h12l-3-3"/><path d="M18 15l3-3"/></svg>
        로그아웃
      </button>
    </div>
  </aside>

  <!-- ── 메인 ── -->
  <main class="mypage-main">
    <div class="mypage-header">
      <span class="mypage-header__title">내 정보 수정</span>
      <div class="mypage-header__right">
        <a href="contact.html" class="mypage-header__contact">서비스문의</a>
        <span class="mypage-header__user" id="navUserName">홍길동</span>
      </div>
    </div>

    <div class="mypage-content">

      <!-- 정보 수정 폼 -->
      <form onsubmit="return false;" id="profileForm" class="mypage-form">

        <div class="mypage-form-group">
          <label class="mypage-form-label" for="profileName">이름</label>
          <input type="text" class="mypage-form-input" id="profileName" value="홍길동" placeholder="이름" />
        </div>

        <div class="mypage-form-group">
          <label class="mypage-form-label" for="profileEmail">이메일</label>
          <input type="email" class="mypage-form-input" id="profileEmail" value="user@example.com" placeholder="이메일" />
        </div>

        <div class="mypage-form-group">
          <label class="mypage-form-label" for="profilePhone">전화번호</label>
          <input type="tel" class="mypage-form-input" id="profilePhone" value="010-1234-5678" placeholder="전화번호" maxlength="13" />
        </div>

        <hr class="mypage-form-divider">

        <div class="mypage-form-group">
          <label class="mypage-form-label" for="currentPw">현재 비밀번호</label>
          <input type="password" class="mypage-form-input" id="currentPw" placeholder="현재 비밀번호" autocomplete="current-password" />
        </div>

        <div class="mypage-form-group">
          <label class="mypage-form-label" for="newPw">
            새 비밀번호
            <span style="font-size:12px;font-weight:400;color:#8C8C8C;">(변경 시에만 입력)</span>
          </label>
          <input type="password" class="mypage-form-input" id="newPw" placeholder="새 비밀번호 (8자 이상)" autocomplete="new-password" />
        </div>

        <div class="mypage-form-group">
          <label class="mypage-form-label" for="newPwConfirm">새 비밀번호 확인</label>
          <input type="password" class="mypage-form-input" id="newPwConfirm" placeholder="새 비밀번호 확인" autocomplete="new-password" />
          <div class="mypage-form-error" id="pwMatchError">비밀번호가 일치하지 않습니다.</div>
        </div>

        <button type="button" class="mypage-form-save-btn" id="btnSaveProfile">변경 사항 저장</button>

      </form>

      <!-- 회원 탈퇴 -->
      <div class="mypage-withdraw-zone">
        <div class="mypage-withdraw-text">
          <span class="mypage-withdraw-title">회원 탈퇴</span>
          <span class="mypage-withdraw-desc">탈퇴 시 모든 발송 내역 및 증명서가 삭제됩니다.</span>
        </div>
        <button class="mypage-withdraw-btn" onclick="alert('회원 탈퇴 기능은 준비 중입니다.')">탈퇴하기</button>
      </div>

    </div>
  </main>

</div>

<script>
  if (!sessionStorage.getItem('logged_in')) {
    window.location.href = 'login.html';
  }
  var userName = sessionStorage.getItem('user_name') || '홍길동';
  var userEmail = sessionStorage.getItem('user_email') || 'user@example.com';
  document.getElementById('navUserName').textContent = userName;
  document.getElementById('sidebarUserName').textContent = userName;
  document.getElementById('sidebarUserEmail').textContent = userEmail;
  document.getElementById('profileEmail').value = userEmail;

  /* 전화번호 자동 하이픈 */
  document.getElementById('profilePhone').addEventListener('input', function () {
    var v = this.value.replace(/\D/g, '').slice(0, 11);
    if (v.length <= 3) { this.value = v; return; }
    if (v.length <= 7) { this.value = v.slice(0,3) + '-' + v.slice(3); return; }
    this.value = v.slice(0,3) + '-' + v.slice(3,7) + '-' + v.slice(7);
  });

  /* 비밀번호 일치 확인 */
  function checkPwMatch() {
    var nv = document.getElementById('newPw').value;
    var nc = document.getElementById('newPwConfirm').value;
    var errEl = document.getElementById('pwMatchError');
    errEl.style.display = (nc && nv !== nc) ? 'block' : 'none';
  }
  document.getElementById('newPw').addEventListener('input', checkPwMatch);
  document.getElementById('newPwConfirm').addEventListener('input', checkPwMatch);

  /* 저장 버튼 */
  document.getElementById('btnSaveProfile').addEventListener('click', function () {
    alert('정보 수정 기능은 준비 중입니다.');
  });
</script>

</body>
</html>
