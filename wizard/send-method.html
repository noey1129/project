<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>발송 방식 선택 – 로싸인</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="../lease-question.css" />
  <link rel="stylesheet" href="wizard.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet" />
</head>
<body class="page-wizard">

  <header class="nav"></header>

  <main class="wizard-main" style="padding-top: 100px;">

    <div class="wizard-header">
      <h1 class="wizard-title">발송 방식을 선택해 주세요.</h1>
      <p class="wizard-sub">내용증명 발송 방식에 따라 비용과 증명서 종류가 달라집니다.</p>
    </div>

    <div class="wizard-wrap">

      <!-- 전자문서 + 공전소 -->
      <div class="method-card" id="cardCertified" data-value="certified">
        <div class="method-card__top">
          <div class="method-card__badge method-card__badge--rec">추천</div>
          <span class="method-card__price">19,800원</span>
        </div>
        <strong class="method-card__name">전자문서 + 공전소 등록</strong>
        <span class="method-card__tagline">우체국 내용증명과 동일한 법적 효력</span>
        <ul class="method-card__certs">
          <li>감사추적증명서</li>
          <li>전자문서증명서 <em>(6개월)</em></li>
          <li>유통증명서 <em>(3개월)</em></li>
        </ul>
        <div class="method-card__required">
          필요 정보: 이름 · 전화번호 · 생년월일
        </div>
      </div>

      <!-- 알림톡 + 공전소 -->
      <div class="method-card" id="cardSimple" data-value="simple">
        <div class="method-card__top">
          <div class="method-card__badge">일반</div>
          <span class="method-card__price">9,900원</span>
        </div>
        <strong class="method-card__name">알림톡 + 공전소 등록</strong>
        <span class="method-card__tagline">카카오 알림톡으로 간편하게 발송</span>
        <ul class="method-card__certs">
          <li>감사추적증명서</li>
          <li>전자문서증명서 <em>(6개월)</em></li>
        </ul>
        <div class="method-card__required">
          필요 정보: 이름 · 전화번호
        </div>
      </div>

    </div>

  </main>

  <div class="bottom-bar">
    <div class="bottom-bar__inner">
      <button class="btn-prev" id="btnPrev">이전</button>
      <button class="btn-next" id="btnNext" disabled>다음</button>
    </div>
  </div>

  <script src="send-method.js"></script>
  <script src="../common-helper.js"></script>
</body>
</html>
