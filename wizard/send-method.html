<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>발송 방식 선택 – Sendit</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="../lease-question.css" />
  <link rel="stylesheet" href="wizard.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet" />
</head>
<body class="page-wizard">

  <header class="nav">
    <div class="nav__inner">
      <div class="nav__left">
        <a href="../index.html" class="nav__logo">Sendit</a>
        <nav class="nav__links">
          <a href="../index.html#hero"    class="nav__link nav__link--active">이용 상황</a>
          <a href="../index.html#how"     class="nav__link">이용 방법</a>
          <a href="../index.html#pricing" class="nav__link">가격</a>
          <a href="../index.html#faq"     class="nav__link">자주 묻는 질문</a>
          <a href="../index.html#trust"   class="nav__link">인증 및 문서</a>
          <a href="../index.html#law"     class="nav__link">법 조항</a>
        </nav>
      </div>
      <div class="nav__right">
        <a href="#" class="nav__contact">서비스문의</a>
        <button class="btn btn--dark">로그인</button>
      </div>
    </div>
  </header>

  <main class="wizard-main">

    <div class="wizard-header">
      <h1 class="wizard-title">발송 방식을 선택해 주세요.</h1>
      <p class="wizard-sub">내용증명 발송 방식에 따라 비용과 효력이 달라집니다.</p>
    </div>

    <div class="wizard-wrap">

      <div class="method-card" id="cardCertified" data-value="certified">
        <div class="method-card__badge">추천</div>
        <div class="method-card__info">
          <strong class="method-card__name">본인인증 발송</strong>
          <span class="method-card__desc">발신인 신원을 인증하여 법적 효력을 강화합니다.<br />등기 우편 발송 + 전자문서 인증 포함</span>
        </div>
        <span class="method-card__price">19,800원</span>
      </div>

      <div class="method-card" id="cardSimple" data-value="simple">
        <div class="method-card__badge">일반</div>
        <div class="method-card__info">
          <strong class="method-card__name">일반 발송</strong>
          <span class="method-card__desc">간편하게 내용증명을 발송합니다.<br />등기 우편 발송 포함</span>
        </div>
        <span class="method-card__price">9,900원</span>
      </div>

    </div>

  </main>

  <div class="bottom-bar">
    <div class="bottom-bar__inner">
      <button class="btn-prev" id="btnPrev">이전</button>
      <button class="btn-next" id="btnNext" disabled>다음</button>
    </div>
  </div>

  <script src="send-method.js"></script>
</body>
</html>
