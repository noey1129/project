<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>직접작성 질문 – 로싸인</title>
  <link rel="stylesheet" href="../../style.css" />
  <link rel="stylesheet" href="../../lease-question.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet" />
</head>
<body class="page-question">

  <header class="nav"></header>

  <main class="question-main">
    <div class="question-wrap">

      <div class="question-header">
        <h1 class="question-title">상대방에게 무엇을 요구하시나요?</h1>
        <p class="question-sub">원하는 결과나 조치 사항을 구체적으로 적어 주세요.</p>
      </div>

      <div class="question-body">

        <div class="progress-row">
          <div class="progress-bar">
            <div class="progress-bar__fill" style="width: calc(3 / 4 * 100%)"></div>
          </div>
          <div class="progress-counter">
            <span class="progress-counter__current">3</span>
            <span class="progress-counter__sep">/</span>
            <span class="progress-counter__total">4</span>
          </div>
        </div>

        <textarea id="demand" class="textarea-field"
          placeholder="상대방에게 요청하고자 하는 내용을 구체적으로 적어 주세요."></textarea>

      </div>
    </div>
  </main>

  <div class="bottom-bar">
    <div class="bottom-bar__inner">
      <button class="btn-prev" id="btnPrev">이전</button>
      <button class="btn-next" id="btnNext" disabled>다음</button>
    </div>
  </div>

  <script src="q3.js"></script>
  <script src="../../common-helper.js"></script>
</body>
</html>
