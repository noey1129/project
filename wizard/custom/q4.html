<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>직접작성 질문 – 로싸인</title>
  <link rel="stylesheet" href="../../style.css" />
  <link rel="stylesheet" href="../../lease-question.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet" />
</head>
<body class="page-question">

  <header class="nav">
    <div class="nav__inner">
      <div class="nav__left">
        <a href="../../index.html" class="nav__logo"><img src="../../assets/Lawsign.svg" alt="Lawsign" height="22"></a>
        <nav class="nav__links">
          <a href="../../index.html#hero"    class="nav__link nav__link--active">이용 상황</a>
          <a href="../../index.html#how"     class="nav__link">이용 방법</a>
          <a href="../../index.html#pricing" class="nav__link">가격</a>
          <a href="../../index.html#faq"     class="nav__link">자주 묻는 질문</a>
          <a href="../../index.html#trust"   class="nav__link">인증 및 문서</a>
          <a href="../../index.html#law"     class="nav__link">법 조항</a>
        </nav>
      </div>
      <div class="nav__right">
        <a href="../../contact.html" class="nav__contact">서비스문의</a>
        <button class="btn btn--dark" onclick="window.location.href='../../login.html'">로그인</button>
      </div>
    </div>
  </header>

  <main class="question-main">
    <div class="question-wrap">

      <div class="question-header">
        <h1 class="question-title">상대방에게 몇 일의 기한을 줄까요?</h1>
        <p class="question-sub">내용증명 수령 후 이행 기한을 선택해 주세요.</p>
      </div>

      <div class="question-body">

        <div class="progress-row">
          <div class="progress-bar">
            <div class="progress-bar__fill" style="width: calc(4 / 4 * 100%)"></div>
          </div>
          <div class="progress-counter">
            <span class="progress-counter__current">4</span>
            <span class="progress-counter__sep">/</span>
            <span class="progress-counter__total">4</span>
          </div>
        </div>

        <div class="answer-list">
          <div class="answer-card" data-value="7">
            <div class="answer-card__info">
              <strong class="answer-card__name">7일</strong>
              <span class="answer-card__desc">빠른 이행을 요청합니다.</span>
            </div>
          </div>
          <div class="answer-card" data-value="14">
            <div class="answer-card__info">
              <strong class="answer-card__name">14일</strong>
              <span class="answer-card__desc">2주의 여유를 드립니다.</span>
            </div>
          </div>
          <div class="answer-card" data-value="30">
            <div class="answer-card__info">
              <strong class="answer-card__name">30일</strong>
              <span class="answer-card__desc">한 달의 여유를 드립니다.</span>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <div class="bottom-bar">
    <div class="bottom-bar__inner">
      <button class="btn-prev" id="btnPrev">이전</button>
      <button class="btn-next" id="btnNext" disabled>발송방법 선택하기</button>
    </div>
  </div>

  <script src="q4.js"></script>
</body>
</html>
