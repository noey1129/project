<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>층간소음 질문 – 로싸인</title>
  <link rel="stylesheet" href="../../style.css" />
  <link rel="stylesheet" href="../../lease-question.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet" />
</head>
<body class="page-question">

  <header class="nav"></header>

  <main class="question-main">
    <div class="question-wrap">

      <div class="question-header">
        <h1 class="question-title">상대방에게 몇 일의 기한을 줄까요?</h1>
        <p class="question-sub">내용증명 수령 후 시정 기한을 선택해 주세요.</p>
      </div>

      <div class="question-body">

        <div class="progress-row">
          <div class="progress-bar">
            <div class="progress-bar__fill" style="width: calc(5 / 5 * 100%)"></div>
          </div>
          <div class="progress-counter">
            <span class="progress-counter__current">5</span>
            <span class="progress-counter__sep">/</span>
            <span class="progress-counter__total">5</span>
          </div>
        </div>

        <div class="answer-list">
          <div class="answer-card" data-value="7">
            <div class="answer-card__info">
              <strong class="answer-card__name">7일</strong>
              <span class="answer-card__desc">빠른 시정을 요청합니다.</span>
            </div>
          </div>
          <div class="answer-card" data-value="14">
            <div class="answer-card__info">
              <strong class="answer-card__name">14일</strong>
              <span class="answer-card__desc">2주의 여유를 드립니다.</span>
            </div>
          </div>
          <div class="answer-card" data-value="30">
            <div class="answer-card__info">
              <strong class="answer-card__name">30일</strong>
              <span class="answer-card__desc">한 달의 여유를 드립니다.</span>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <div class="bottom-bar">
    <div class="bottom-bar__inner">
      <button class="btn-prev" id="btnPrev">이전</button>
      <button class="btn-next" id="btnNext" disabled>발송방법 선택하기</button>
    </div>
  </div>

  <script src="q5.js"></script>
  <script src="../../common-helper.js"></script>
</body>
</html>
