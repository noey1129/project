<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>결제 – Sendit</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="../lease-question.css" />
  <link rel="stylesheet" href="wizard.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet" />
</head>
<body class="page-wizard">

  <header class="nav">
    <div class="nav__inner">
      <div class="nav__left">
        <a href="../index.html" class="nav__logo">Sendit</a>
        <nav class="nav__links">
          <a href="../index.html#hero"    class="nav__link nav__link--active">이용 상황</a>
          <a href="../index.html#how"     class="nav__link">이용 방법</a>
          <a href="../index.html#pricing" class="nav__link">가격</a>
          <a href="../index.html#faq"     class="nav__link">자주 묻는 질문</a>
          <a href="../index.html#trust"   class="nav__link">인증 및 문서</a>
          <a href="../index.html#law"     class="nav__link">법 조항</a>
        </nav>
      </div>
      <div class="nav__right">
        <a href="../contact.html" class="nav__contact">서비스문의</a>
        <button class="btn btn--dark" onclick="window.location.href='../login.html'">로그인</button>
      </div>
    </div>
  </header>

  <!-- ── 결제 화면 ── -->
  <main class="wizard-main" id="payScreen">

    <div class="wizard-header">
      <h1 class="wizard-title">결제를 진행합니다.</h1>
      <p class="wizard-sub">아래 내용을 확인 후 결제해 주세요.</p>
    </div>

    <div class="wizard-wrap">

      <div class="summary-card" id="summaryCard">
        <!-- JS로 채워짐 -->
      </div>

      <button class="btn-pay" id="btnPay">카드결제</button>

    </div>

  </main>

  <!-- ── 완료 화면 ── -->
  <main class="wizard-main complete-screen" id="completeScreen">

    <div class="complete-icon">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>

    <h1 class="complete-title">발송이 완료되었습니다!</h1>
    <p class="complete-desc" id="completeDesc"></p>

    <ul class="complete-list" id="completeList"></ul>

    <a href="../mypage.html" class="btn btn--dark btn--lg" style="margin-top: 12px;" id="completeHomeBtn">발송 내역 확인하기</a>

  </main>

  <script src="payment.js"></script>
</body>
</html>
