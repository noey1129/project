<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>대여금 질문 – 로싸인</title>
  <link rel="stylesheet" href="../../style.css" />
  <link rel="stylesheet" href="../../lease-question.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet" />
</head>
<body class="page-question">

  <header class="nav"></header>

  <main class="question-main">
    <div class="question-wrap">

      <div class="question-header">
        <h1 class="question-title">일부라도 돌려받으셨나요?</h1>
        <p class="question-sub">부분 상환이 있었다면 금액을 알려 주세요.</p>
      </div>

      <div class="question-body">

        <div class="progress-row">
          <div class="progress-bar">
            <div class="progress-bar__fill" style="width: calc(4 / 5 * 100%)"></div>
          </div>
          <div class="progress-counter">
            <span class="progress-counter__current">4</span>
            <span class="progress-counter__sep">/</span>
            <span class="progress-counter__total">5</span>
          </div>
        </div>

        <div class="answer-list">
          <div class="answer-card" data-value="yes">
            <div class="answer-card__info">
              <strong class="answer-card__name">있어요</strong>
              <span class="answer-card__desc">일부 금액을 돌려받았어요.</span>
            </div>
          </div>
          <div class="answer-card" data-value="no">
            <div class="answer-card__info">
              <strong class="answer-card__name">없어요</strong>
              <span class="answer-card__desc">아직 한 푼도 돌려받지 못했어요.</span>
            </div>
          </div>
        </div>

        <!-- 조건부: '있어요' 선택 시 -->
        <div class="conditional-section" id="amountSection">
          <span class="input-group-label">상환받은 금액</span>
          <div class="input-amount-wrap">
            <input
              type="text"
              id="repaidAmount"
              class="input-field input-field--amount"
              placeholder="금액을 입력해주세요."
              inputmode="numeric"
            />
            <span class="input-amount-suffix">원</span>
          </div>
        </div>

      </div>
    </div>
  </main>

  <div class="bottom-bar">
    <div class="bottom-bar__inner">
      <button class="btn-prev" id="btnPrev">이전</button>
      <button class="btn-next" id="btnNext" disabled>다음</button>
    </div>
  </div>

  <script src="q4.js"></script>
  <script src="../../common-helper.js"></script>
</body>
</html>
