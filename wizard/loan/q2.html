<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>대여금 질문 – 로싸인</title>
  <link rel="stylesheet" href="../../style.css" />
  <link rel="stylesheet" href="../../lease-question.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet" />
</head>
<body class="page-question">

  <header class="nav"></header>

  <main class="question-main">
    <div class="question-wrap">

      <div class="question-header">
        <h1 class="question-title">변제 기한이 정해져 있었나요?</h1>
        <p class="question-sub">언제까지 갚기로 했는지 알려 주세요.</p>
      </div>

      <div class="question-body">

        <div class="progress-row">
          <div class="progress-bar">
            <div class="progress-bar__fill" style="width: calc(2 / 5 * 100%)"></div>
          </div>
          <div class="progress-counter">
            <span class="progress-counter__current">2</span>
            <span class="progress-counter__sep">/</span>
            <span class="progress-counter__total">5</span>
          </div>
        </div>

        <div class="answer-list">
          <div class="answer-card" data-value="yes">
            <div class="answer-card__info">
              <strong class="answer-card__name">있었어요</strong>
              <span class="answer-card__desc">변제 기한을 정해두었어요.</span>
            </div>
          </div>
          <div class="answer-card" data-value="no">
            <div class="answer-card__info">
              <strong class="answer-card__name">없었어요</strong>
              <span class="answer-card__desc">별도로 기한을 정하지 않았어요.</span>
            </div>
          </div>
        </div>

        <!-- 조건부: '있었어요' 선택 시 -->
        <div class="conditional-section" id="dateSection">
          <span class="input-group-label">변제 약속 날짜</span>
          <div class="input-row">
            <input type="text" id="repayYear"  class="input-field input-field--main" placeholder="년도" inputmode="numeric" maxlength="4" />
            <input type="text" id="repayMonth" class="input-field input-field--main" placeholder="월"  inputmode="numeric" maxlength="2" />
            <input type="text" id="repayDay"   class="input-field input-field--main" placeholder="일"  inputmode="numeric" maxlength="2" />
          </div>
        </div>

      </div>
    </div>
  </main>

  <div class="bottom-bar">
    <div class="bottom-bar__inner">
      <button class="btn-prev" id="btnPrev">이전</button>
      <button class="btn-next" id="btnNext" disabled>다음</button>
    </div>
  </div>

  <script src="q2.js"></script>
  <script src="../../common-helper.js"></script>
</body>
</html>
