<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>임대차 질문 – 로싸인</title>
  <link rel="stylesheet" href="../../style.css" />
  <link rel="stylesheet" href="../../lease-question.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet" />
</head>
<body class="page-question">

  <!-- ───────────────────────────── NAV ───────────────────────────── -->
  <header class="nav"></header>

  <!-- ───────────────────────────── MAIN ───────────────────────────── -->
  <main class="question-main">
    <div class="question-wrap">

      <!-- 제목 -->
      <div class="question-header">
        <h1 class="question-title">보증금 반환 기한은 언제로 하시겠어요?</h1>
        <p class="question-sub">보증금을 반환 받고 싶은 날짜를 입력해 주세요.<br/>일반적으로 명도 후 1~2주 정도의 기간을 줍니다.</p>
      </div>

      <!-- 진행 바 + 입력 -->
      <div class="question-body">

        <!-- 프로그레스 바 -->
        <div class="progress-row">
          <div class="progress-bar">
            <div class="progress-bar__fill" style="width: calc(6 / 12 * 100%)"></div>
          </div>
          <div class="progress-counter">
            <span class="progress-counter__current">6</span>
            <span class="progress-counter__sep">/</span>
            <span class="progress-counter__total">12</span>
          </div>
        </div>

        <!-- 날짜 입력 (년도 / 월 / 일) -->
        <div class="input-row">
          <input
            type="text"
            id="inputYear"
            class="input-field input-field--main"
            placeholder="년도"
            inputmode="numeric"
            maxlength="4"
          />
          <input
            type="text"
            id="inputMonth"
            class="input-field input-field--main"
            placeholder="월"
            inputmode="numeric"
            maxlength="2"
          />
          <input
            type="text"
            id="inputDay"
            class="input-field input-field--main"
            placeholder="일"
            inputmode="numeric"
            maxlength="2"
          />
        </div>

      </div>
    </div>
  </main>

  <!-- ───────────────────────────── BOTTOM BAR ───────────────────────────── -->
  <div class="bottom-bar">
    <div class="bottom-bar__inner">
      <button class="btn-prev" id="btnPrev">이전</button>
      <button class="btn-next" id="btnNext" disabled>다음</button>
    </div>
  </div>

  <script src="q6.js"></script>
  <script src="../../common-helper.js"></script>
</body>
</html>
