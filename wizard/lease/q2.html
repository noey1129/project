<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>임대차 질문 – 로싸인</title>
  <link rel="stylesheet" href="../../style.css" />
  <link rel="stylesheet" href="../../lease-question.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet" />
</head>
<body class="page-question">

  <!-- ───────────────────────────── NAV ───────────────────────────── -->
  <header class="nav"></header>

  <!-- ───────────────────────────── MAIN ───────────────────────────── -->
  <main class="question-main">
    <div class="question-wrap">

      <!-- 제목 -->
      <div class="question-header">
        <h1 class="question-title">이번 내용증명의 목적은 무엇인가요?</h1>
        <p class="question-sub">현재 임대차 계약 상태를 알려 주세요.</p>
      </div>

      <!-- 진행 바 + 카드 -->
      <div class="question-body">

        <!-- 프로그레스 바 -->
        <div class="progress-row">
          <div class="progress-bar">
            <div class="progress-bar__fill" style="width: calc(2 / 12 * 100%)"></div>
          </div>
          <div class="progress-counter">
            <span class="progress-counter__current">2</span>
            <span class="progress-counter__sep">/</span>
            <span class="progress-counter__total">12</span>
          </div>
        </div>

        <!-- 선택지 카드 -->
        <div class="answer-list">

          <div class="answer-card" data-value="deposit">
            <div class="answer-card__info">
              <strong class="answer-card__name">보증금 반환을 요구하고 싶어요.</strong>
            </div>
          </div>

          <div class="answer-card" data-value="termination">
            <div class="answer-card__info">
              <strong class="answer-card__name">계약 해지 의사를 전달하고 싶어요.</strong>
            </div>
          </div>

          <div class="answer-card" data-value="correction">
            <div class="answer-card__info">
              <strong class="answer-card__name">문제 시정을 요청하고 싶어요.</strong>
            </div>
          </div>

        </div>
      </div>

    </div>
  </main>

  <!-- ───────────────────────────── BOTTOM BAR ───────────────────────────── -->
  <div class="bottom-bar">
    <div class="bottom-bar__inner">
      <button class="btn-prev" id="btnPrev">이전</button>
      <button class="btn-next" id="btnNext" disabled>다음</button>
    </div>
  </div>

  <script src="q2.js"></script>
  <script src="../../common-helper.js"></script>
</body>
</html>
