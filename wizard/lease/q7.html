<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>임대차 질문 – 로싸인</title>
  <link rel="stylesheet" href="../../style.css" />
  <link rel="stylesheet" href="../../lease-question.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet" />
</head>
<body class="page-question">

  <!-- ───────────────────────────── NAV ───────────────────────────── -->
  <header class="nav"></header>

  <!-- ───────────────────────────── MAIN ───────────────────────────── -->
  <main class="question-main">
    <div class="question-wrap">

      <!-- 제목 -->
      <div class="question-header">
        <h1 class="question-title">임대차 계약 해지 또는 문제 재기를 전달한 적이 있나요?</h1>
        <p class="question-sub">이전에 통지한 사실이 문서에 반영됩니다.</p>
      </div>

      <!-- 진행 바 + 카드 -->
      <div class="question-body">

        <!-- 프로그레스 바 -->
        <div class="progress-row">
          <div class="progress-bar">
            <div class="progress-bar__fill" style="width: calc(7 / 12 * 100%)"></div>
          </div>
          <div class="progress-counter">
            <span class="progress-counter__current">7</span>
            <span class="progress-counter__sep">/</span>
            <span class="progress-counter__total">12</span>
          </div>
        </div>

        <!-- 선택지 카드 -->
        <div class="answer-list">

          <div class="answer-card answer-card--lg" data-value="first">
            <div class="answer-card__info">
              <strong class="answer-card__name">본 내용 증명을 통해 처음 전달합니다.</strong>
            </div>
          </div>

          <div class="answer-card answer-card--lg" data-value="previous">
            <div class="answer-card__info">
              <strong class="answer-card__name">이미 구두 또는 문자로 전달한 적이 있습니다.</strong>
            </div>
          </div>

        </div>
      </div>

    </div>
  </main>

  <!-- ───────────────────────────── BOTTOM BAR ───────────────────────────── -->
  <div class="bottom-bar">
    <div class="bottom-bar__inner">
      <button class="btn-prev" id="btnPrev">이전</button>
      <button class="btn-next" id="btnNext" disabled>다음</button>
    </div>
  </div>

  <script src="q7.js"></script>
  <script src="../../common-helper.js"></script>
</body>
</html>
