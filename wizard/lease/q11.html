<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>임대차 질문 – 로싸인</title>
  <link rel="stylesheet" href="../../style.css" />
  <link rel="stylesheet" href="../../lease-question.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet" />
</head>
<body class="page-question">

  <!-- ───────────────────────────── NAV ───────────────────────────── -->
  <header class="nav">
    <div class="nav__inner">
      <div class="nav__left">
        <a href="../../index.html" class="nav__logo"><img src="../../assets/Lawsign.svg" alt="Lawsign" height="22"></a>
        <nav class="nav__links">
          <a href="../../index.html#hero"    class="nav__link nav__link--active">이용 상황</a>
          <a href="../../index.html#how"     class="nav__link">이용 방법</a>
          <a href="../../index.html#pricing" class="nav__link">가격</a>
          <a href="../../index.html#faq"     class="nav__link">자주 묻는 질문</a>
          <a href="../../index.html#trust"   class="nav__link">인증 및 문서</a>
          <a href="../../index.html#law"     class="nav__link">법 조항</a>
        </nav>
      </div>
      <div class="nav__right">
        <a href="../../contact.html" class="nav__contact">서비스문의</a>
        <button class="btn btn--dark" onclick="window.location.href='../../login.html'">로그인</button>
      </div>
    </div>
  </header>

  <!-- ───────────────────────────── MAIN ───────────────────────────── -->
  <main class="question-main">
    <div class="question-wrap">

      <!-- 제목 -->
      <div class="question-header">
        <h1 class="question-title">장기수선충당금 반환을 함께 요구하시겠어요?</h1>
        <p class="question-sub">아파트 등에서 납부한 장기수선충당금이 있다면 선택하세요.</p>
      </div>

      <!-- 진행 바 + 카드 -->
      <div class="question-body">

        <!-- 프로그레스 바 -->
        <div class="progress-row">
          <div class="progress-bar">
            <div class="progress-bar__fill" style="width: calc(11 / 12 * 100%)"></div>
          </div>
          <div class="progress-counter">
            <span class="progress-counter__current">11</span>
            <span class="progress-counter__sep">/</span>
            <span class="progress-counter__total">12</span>
          </div>
        </div>

        <!-- 선택지 카드 -->
        <div class="answer-list">

          <div class="answer-card answer-card--md" data-value="yes">
            <div class="answer-card__info">
              <strong class="answer-card__name">요구함</strong>
            </div>
          </div>

          <div class="answer-card answer-card--md" data-value="no">
            <div class="answer-card__info">
              <strong class="answer-card__name">요구하지 않음</strong>
            </div>
          </div>

        </div>

        <!-- 조건부: 요구함 선택 시 금액 입력 표시 -->
        <div class="conditional-section" id="amountSection">
          <span class="input-group-label">금액</span>
          <div class="input-amount-wrap">
            <input
              type="text"
              id="inputAmount"
              class="input-field input-field--amount"
              placeholder="금액을 입력해주세요."
              inputmode="numeric"
            />
            <span class="input-amount-suffix">원</span>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- ───────────────────────────── BOTTOM BAR ───────────────────────────── -->
  <div class="bottom-bar">
    <div class="bottom-bar__inner">
      <button class="btn-prev" id="btnPrev">이전</button>
      <button class="btn-next" id="btnNext" disabled>다음</button>
    </div>
  </div>

  <script src="q11.js"></script>
</body>
</html>
