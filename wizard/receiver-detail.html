<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>수신인 정보 입력 – 로싸인</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="../lease-question.css" />
  <link rel="stylesheet" href="wizard.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet" />
</head>
<body class="page-wizard">

  <header class="nav"></header>

  <main class="wizard-main">

    <div class="wizard-header">
      <h1 class="wizard-title">수신인 연락처를 입력해 주세요.</h1>
      <p class="wizard-sub" id="methodDesc"></p>
    </div>

    <div class="wizard-wrap">

      <div class="info-box">

        <div class="wizard-form-group">
          <label class="wizard-form-label">
            전화번호 <span>(필수)</span>
          </label>
          <input type="tel" class="wizard-input" id="receiverPhone" placeholder="010-0000-0000" maxlength="13" />
        </div>

        <div class="wizard-form-group">
          <label class="wizard-form-label">
            이름 <span id="nameHint"></span>
          </label>
          <input type="text" class="wizard-input" id="receiverName" placeholder="수신인 이름" />
        </div>

        <div class="wizard-form-group" id="birthGroup" style="display:none;">
          <label class="wizard-form-label">
            생년월일 <span>(전자문서+공전소 필수)</span>
          </label>
          <input type="text" class="wizard-input" id="receiverBirth" placeholder="8자리 (예: 19900101)" maxlength="8" />
        </div>

      </div>

    </div>

  </main>

  <div class="bottom-bar">
    <div class="bottom-bar__inner">
      <button class="btn-prev" id="btnPrev">이전</button>
      <button class="btn-next" id="btnNext" disabled>결제하기</button>
    </div>
  </div>

  <script src="receiver-detail.js"></script>
  <script src="../common-helper.js"></script>
</body>
</html>
