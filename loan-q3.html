<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>대여금 질문 – Sendit</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="lease-question.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet" />
</head>
<body class="page-question">

  <header class="nav">
    <div class="nav__inner">
      <div class="nav__left">
        <a href="index.html" class="nav__logo">Sendit</a>
        <nav class="nav__links">
          <a href="index.html#hero"    class="nav__link nav__link--active">이용 상황</a>
          <a href="index.html#how"     class="nav__link">이용 방법</a>
          <a href="index.html#pricing" class="nav__link">가격</a>
          <a href="index.html#faq"     class="nav__link">자주 묻는 질문</a>
          <a href="index.html#trust"   class="nav__link">인증 및 문서</a>
          <a href="index.html#law"     class="nav__link">법 조항</a>
        </nav>
      </div>
      <div class="nav__right">
        <a href="contact.html" class="nav__contact">서비스문의</a>
        <button class="btn btn--dark" onclick="window.location.href='login.html'">로그인</button>
      </div>
    </div>
  </header>

  <main class="question-main">
    <div class="question-wrap">

      <div class="question-header">
        <h1 class="question-title">대여 사실을 입증할 증거가 있나요?</h1>
        <p class="question-sub">해당하는 항목을 모두 선택해 주세요.</p>
      </div>

      <div class="question-body">

        <div class="progress-row">
          <div class="progress-bar">
            <div class="progress-bar__fill" style="width: calc(3 / 5 * 100%)"></div>
          </div>
          <div class="progress-counter">
            <span class="progress-counter__current">3</span>
            <span class="progress-counter__sep">/</span>
            <span class="progress-counter__total">5</span>
          </div>
        </div>

        <div class="answer-list answer-list--multi">
          <div class="answer-card answer-card--multi" data-value="계좌이체내역">
            <div class="answer-card__info">
              <strong class="answer-card__name">계좌이체내역</strong>
              <span class="answer-card__desc">은행 이체 기록이 있어요.</span>
            </div>
          </div>
          <div class="answer-card answer-card--multi" data-value="차용증">
            <div class="answer-card__info">
              <strong class="answer-card__name">차용증</strong>
              <span class="answer-card__desc">서면 차용증을 작성했어요.</span>
            </div>
          </div>
          <div class="answer-card answer-card--multi" data-value="카카오톡·문자">
            <div class="answer-card__info">
              <strong class="answer-card__name">카카오톡·문자</strong>
              <span class="answer-card__desc">빌려준 사실을 인정한 대화가 있어요.</span>
            </div>
          </div>
          <div class="answer-card answer-card--exclusive" data-value="없어요">
            <div class="answer-card__info">
              <strong class="answer-card__name">없어요</strong>
              <span class="answer-card__desc">특별한 증거가 없어요.</span>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <div class="bottom-bar">
    <div class="bottom-bar__inner">
      <button class="btn-prev" id="btnPrev">이전</button>
      <button class="btn-next" id="btnNext" disabled>다음</button>
    </div>
  </div>

  <script src="loan-q3.js"></script>
  <script src="nav-helper.js"></script>
</body>
</html>
