<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 – Sendit</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body class="page-auth">

  <header class="nav">
    <div class="nav__inner">
      <div class="nav__left">
        <a href="index.html" class="nav__logo">Sendit</a>
        <nav class="nav__links">
          <a href="index.html#hero"    class="nav__link">이용 상황</a>
          <a href="index.html#how"     class="nav__link">이용 방법</a>
          <a href="index.html#pricing" class="nav__link">가격</a>
          <a href="index.html#faq"     class="nav__link">자주 묻는 질문</a>
          <a href="index.html#trust"   class="nav__link">인증 및 문서</a>
          <a href="index.html#law"     class="nav__link">법 조항</a>
        </nav>
      </div>
      <div class="nav__right">
        <a href="contact.html" class="nav__contact">서비스문의</a>
        <button class="btn btn--dark" onclick="window.location.href='login.html'">로그인</button>
      </div>
    </div>
  </header>

  <main class="auth-main">
    <div class="auth-card">

      <div class="auth-header">
        <span class="auth-logo">Sendit</span>
        <span class="auth-tagline">내용증명, 더 쉽게</span>
      </div>

      <!-- 소셜 로그인 -->
      <div class="social-btns">
        <button class="social-btn social-btn--kakao" id="btnKakao">
          <svg width="20" height="18" viewBox="0 0 20 18" fill="none">
            <path d="M10 0C4.477 0 0 3.358 0 7.5c0 2.668 1.766 5.013 4.438 6.4L3.25 18l4.953-2.812C8.714 15.39 9.35 15.5 10 15.5c5.523 0 10-3.358 10-7.5S15.523 0 10 0z" fill="#191919"/>
          </svg>
          카카오로 시작하기
        </button>
        <button class="social-btn social-btn--naver" id="btnNaver">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M10.25 9.43L7.5 5H5v8h2.75V8.57L10.5 13H13V5h-2.75v4.43z" fill="#fff"/>
          </svg>
          네이버로 시작하기
        </button>
        <button class="social-btn social-btn--google" id="btnGoogle">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M19.6 10.23c0-.68-.06-1.36-.17-2H10v3.79h5.39a4.6 4.6 0 01-2 3.02v2.51h3.23c1.89-1.74 2.98-4.3 2.98-7.32z" fill="#4285F4"/>
            <path d="M10 20c2.7 0 4.96-.9 6.62-2.44l-3.23-2.51c-.9.6-2.04.96-3.39.96-2.6 0-4.8-1.76-5.59-4.12H1.08v2.59A9.99 9.99 0 0010 20z" fill="#34A853"/>
            <path d="M4.41 11.89A6.01 6.01 0 014.1 10c0-.65.11-1.28.31-1.89V5.52H1.08A9.99 9.99 0 000 10c0 1.61.39 3.14 1.08 4.48l3.33-2.59z" fill="#FBBC04"/>
            <path d="M10 3.96c1.47 0 2.79.51 3.83 1.49l2.87-2.87C14.95.9 12.7 0 10 0A9.99 9.99 0 001.08 5.52l3.33 2.59C5.2 5.72 7.4 3.96 10 3.96z" fill="#EA4335"/>
          </svg>
          Google로 시작하기
        </button>
      </div>

      <div class="auth-divider">또는</div>

      <!-- 이메일 로그인 폼 -->
      <form class="auth-form" id="loginForm" onsubmit="return false;">
        <input
          type="email"
          id="loginEmail"
          class="auth-input"
          placeholder="이메일"
          autocomplete="email"
        />
        <input
          type="password"
          id="loginPassword"
          class="auth-input"
          placeholder="비밀번호"
          autocomplete="current-password"
        />
        <button type="submit" class="btn-auth-submit" id="btnLogin" disabled>로그인</button>
      </form>

      <!-- 하단 링크 -->
      <div class="auth-footer-link">
        <a href="#">비밀번호 찾기</a>
        <span class="sep">|</span>
        <a href="signup.html">회원가입</a>
      </div>

    </div>
  </main>

  <script src="login.js"></script>
</body>
</html>
