<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 – 로싸인</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body class="page-auth page-auth--login">

  <header class="nav"></header>

  <main class="auth-main">
    <div class="login-wrap">

      <!-- 로고 + 타이틀 -->
      <div class="login-header">
        <span class="login-logo"><img src="assets/Lawsign.svg" alt="Lawsign" height="38" /></span>
        <h1 class="login-title">로그인</h1>
      </div>

      <!-- 이메일 로그인 폼 -->
      <form class="login-form" id="loginForm" onsubmit="return false;">

        <div class="auth-field">
          <label class="auth-field-label" for="loginEmail">이메일</label>
          <input
            type="email"
            id="loginEmail"
            class="auth-input login-input"
            placeholder="이메일 주소"
            autocomplete="email"
          />
        </div>

        <div class="auth-field">
          <label class="auth-field-label" for="loginPassword">비밀번호</label>
          <input
            type="password"
            id="loginPassword"
            class="auth-input login-input"
            placeholder="비밀번호"
            autocomplete="current-password"
          />
        </div>

        <label class="auth-remember">
          <input type="checkbox" id="chkRemember" />
          <span>이메일 주소 저장</span>
        </label>

        <div class="login-actions">
          <button type="submit" class="btn-login-submit" id="btnLogin" disabled>로그인</button>

          <div class="login-footer-links">
            <div class="login-footer-left">
              <span>아직 계정이 없으신가요?</span>
              <a href="signup.html">회원가입</a>
            </div>
            <div class="login-footer-right">
              <a href="find-account.html">계정 찾기</a>
              <span class="footer-sep">|</span>
              <a href="reset-password.html">비밀번호 재설정</a>
            </div>
          </div>
        </div>

      </form>

      <!-- TODO: 테스트용 — 출시 전 제거 -->
      <div style="margin-top:20px; padding-top:16px; border-top:1px dashed #E7E9EB;">
        <button onclick="quickLogin()" style="width:100%;padding:12px 16px;background:#F8F9FA;border:1px dashed #D7DBDF;border-radius:8px;font-size:13px;color:#696B6D;cursor:pointer;font-family:inherit;text-align:left;">
          🧪 테스트 유저로 바로 로그인 &nbsp;<span style="color:#AFAFAF;">test@sendit.kr / 1234</span>
        </button>
      </div>

    </div>
  </main>

  <script src="login.js"></script>
  <script>
    function quickLogin() {
      sessionStorage.setItem('logged_in', 'true');
      sessionStorage.setItem('user_name', '홍길동');
      window.location.href = 'mypage.html';
    }
  </script>
  <script src="common-helper.js"></script>
</body>
</html>
