<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 – 로싸인</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body class="page-auth">

  <header class="nav"></header>

  <main class="auth-main">
    <div class="auth-card">

      <div class="auth-header">
        <span class="auth-logo"><img src="assets/Lawsign.svg" alt="Lawsign" height="22"></span>
        <span class="auth-tagline">내용증명, 더 쉽게</span>
      </div>

      <!-- 이메일 로그인 폼 -->
      <form class="auth-form" id="loginForm" onsubmit="return false;">
        <input
          type="email"
          id="loginEmail"
          class="auth-input"
          placeholder="이메일"
          autocomplete="email"
        />
        <input
          type="password"
          id="loginPassword"
          class="auth-input"
          placeholder="비밀번호"
          autocomplete="current-password"
        />
        <button type="submit" class="btn-auth-submit" id="btnLogin" disabled>로그인</button>
      </form>

      <!-- 하단 링크 -->
      <div class="auth-footer-links-row">
        <div class="auth-footer-link">
          <span>아직 계정이 없으신가요?</span>
          <a href="signup.html">회원가입</a>
        </div>
        <div class="auth-footer-link">
          <a href="#">계정 찾기</a>
          <span class="sep">|</span>
          <a href="#">비밀번호 재설정</a>
        </div>
      </div>

<!-- TODO: 테스트용 — 출시 전 제거 -->
      <div style="margin-top:20px; padding-top:16px; border-top:1px dashed #E7E9EB;">
        <button onclick="quickLogin()" style="width:100%;padding:12px 16px;background:#F8F9FA;border:1px dashed #D7DBDF;border-radius:8px;font-size:13px;color:#696B6D;cursor:pointer;font-family:inherit;text-align:left;">
          🧪 테스트 유저로 바로 로그인 &nbsp;<span style="color:#AFAFAF;">test@sendit.kr / 1234</span>
        </button>
      </div>

    </div>
  </main>

  <script src="login.js"></script>
  <script>
    function quickLogin() {
      sessionStorage.setItem('logged_in', 'true');
      sessionStorage.setItem('user_name', '홍길동');
      window.location.href = 'select-situation.html';
    }
  </script>
  <script src="common-helper.js"></script>
</body>
</html>
