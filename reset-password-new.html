<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>비밀번호 변경 – 로싸인</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body class="page-auth page-auth--login page-auth--top">

  <header class="nav"></header>

  <main class="auth-main">
    <div class="login-wrap">

      <!-- ── 1단계: 새 비밀번호 입력 ── -->
      <div id="viewNewPw">
        <div class="login-header" style="gap:40px;">
          <div style="display:flex; flex-direction:column; gap:10px;">
            <span class="login-logo"><img src="assets/Lawsign.svg" alt="Lawsign" height="38" /></span>
            <h1 class="login-title">비밀번호 재설정</h1>
          </div>
          <p class="find-account-desc">계정의 새 비밀번호를 입력해주세요</p>
        </div>

        <form class="login-form" id="newPwForm" onsubmit="return false;" style="margin-top:20px;">
          <div class="auth-field">
            <label class="auth-field-label" for="newPw">비밀번호</label>
            <input type="password" id="newPw" class="auth-input login-input" placeholder="영문, 숫자, 특수기호가 모두 들어간 8~16글자" />
            <input type="password" id="newPwConfirm" class="auth-input login-input" placeholder="비밀번호를 한번 더 입력해 주세요" style="margin-top:8px;" />
            <p class="auth-input-error" id="newPwError" style="display:none;">비밀번호가 일치하지 않습니다.</p>
          </div>
          <div class="login-actions">
            <button type="submit" class="btn-login-submit" id="btnChangePw" disabled>비밀번호 변경하기</button>
          </div>
        </form>
      </div>

      <!-- ── 2단계: 변경 완료 ── -->
      <div id="viewChanged" style="display:none;">
        <div style="display:flex; flex-direction:column; gap:40px;">
          <span class="login-logo"><img src="assets/Lawsign.svg" alt="Lawsign" height="38" /></span>
          <div style="display:flex; flex-direction:column; align-items:center; gap:30px;">
            <img src="assets/clear.svg" width="80" height="80" alt="완료" />
            <div style="display:flex; flex-direction:column; gap:40px; width:100%;">
              <h2 class="reset-sent-title" style="text-align:center;">비밀번호를 변경했어요</h2>
              <button type="button" class="btn-login-submit" onclick="window.location.href='login.html'">로그인 화면으로 가기</button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="reset-password-new.js"></script>
  <script src="common-helper.js"></script>
</body>
</html>
