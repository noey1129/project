<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>문서 상세 – 로싸인</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="dashboard.css" />
  <link rel="stylesheet" href="doc-detail.css" />
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet" />
</head>
<body class="page-dashboard">

  <div class="db-layout">

    <aside class="db-sidebar" id="dbSidebar"></aside>

    <div class="db-body">

      <header class="db-topbar" id="dbTopbar"></header>

      <main class="db-content">
        <div class="detail-card">

          <!-- 목록으로 -->
          <button class="detail-back" id="backBtn">
            <svg width="8" height="14" viewBox="0 0 8 14" fill="none">
              <path d="M7 1L1 7l6 6" stroke="#1C1E21" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>목록으로</span>
          </button>

          <!-- 2-column layout -->
          <div class="detail-wrap">

            <!-- 좌: 문서 뷰어 -->
            <div class="detail-viewer">

              <div class="viewer-header">
                <span class="viewer-title" id="detailTitle"></span>
                <button class="btn-resend" id="resendBtn">
                  <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
                    <path d="M13 2l-3 1 1 3M10 3a6 6 0 102.5 5" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                  이 문서로 재발송
                </button>
              </div>

              <div class="viewer-toolbar">
                <div class="toolbar-left">
                  <select class="zoom-select" id="zoomSelect">
                    <option value="100">100%</option>
                    <option value="75">75%</option>
                    <option value="125">125%</option>
                    <option value="150">150%</option>
                  </select>
                  <button class="toolbar-icon-btn" title="인쇄">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                      <rect x="3" y="5" width="12" height="9" rx="1" stroke="#333" stroke-width="1.3"/>
                      <path d="M5 5V2h8v3M5 10h8M5 12.5h5" stroke="#333" stroke-width="1.3" stroke-linecap="round"/>
                    </svg>
                  </button>
                  <button class="toolbar-icon-btn" title="전체화면">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                      <path d="M2 6V2h4M12 2h4v4M16 12v4h-4M6 16H2v-4" stroke="#333" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </button>
                </div>

                <div class="toolbar-center">
                  <button class="page-nav-btn" id="prevPage">
                    <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
                      <path d="M9 2L4 6.5 9 11" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </button>
                  <div class="page-display-box">
                    <span id="curPage">1</span>
                    <span>/</span>
                    <span id="totalPage">3</span>
                  </div>
                  <button class="page-nav-btn" id="nextPage">
                    <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
                      <path d="M4 2l5 4.5L4 11" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </button>
                </div>

                <div class="toolbar-right">
                  <button class="btn-pdf-download" id="pdfBtn">
                    <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
                      <path d="M3 1.5h6l3 3v8.5a1 1 0 01-1 1H3a1 1 0 01-1-1v-11a1 1 0 011-1z" stroke="#1C1E21" stroke-width="1.2"/>
                      <path d="M9 1.5v3H12" stroke="#1C1E21" stroke-width="1.2" stroke-linecap="round"/>
                      <path d="M7.5 7v3.5M5.5 9l2 2 2-2" stroke="#1C1E21" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    PDF 다운로드
                  </button>
                </div>
              </div>

              <div class="viewer-body">
                <div class="viewer-page-wrap" id="viewerPageWrap">
                  <div class="viewer-page" id="viewerPage"></div>
                </div>
              </div>

              <div class="viewer-thumbs">
                <button class="thumb-nav-btn" id="thumbPrev">
                  <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M13 4L7 10l6 6" stroke="#888EA0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
                <div class="thumb-list" id="thumbList"></div>
                <button class="thumb-nav-btn" id="thumbNext">
                  <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M7 4l6 6-6 6" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
              </div>

            </div>

            <!-- 우: 정보 패널 -->
            <div class="detail-info" id="detailInfo"></div>

          </div>
        </div>
      </main>

    </div>
  </div>

  <script src="doc-detail.js"></script>
  <script src="dashboard-helper.js"></script>
</body>
</html>
