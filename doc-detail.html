<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>문서 상세 – 로싸인</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="dashboard.css" />
  <link rel="stylesheet" href="doc-detail.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet" />
</head>
<body class="page-dashboard">

  <div class="db-layout">

    <aside class="db-sidebar" id="dbSidebar"></aside>

    <div class="db-body">

      <header class="db-topbar" id="dbTopbar"></header>

      <main class="db-content">
        <div class="detail-card">

          <!-- 목록으로 -->
          <button class="detail-back" id="backBtn">
            <svg width="8" height="14" viewBox="0 0 8 14" fill="none">
              <path d="M7 1L1 7l6 6" stroke="#1C1E21" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>목록으로</span>
          </button>

          <!-- 2-column layout -->
          <div class="detail-wrap">

            <!-- 좌: 문서 뷰어 -->
            <div class="detail-viewer">

              <div class="viewer-header">
                <span class="viewer-title" id="detailTitle"></span>
                <button class="btn-resend" id="resendBtn">
                  <img src="/assets/LNB Icon.svg" alt="">
                  재발송
                </button>
              </div>

              <div class="viewer-toolbar">
                <div class="toolbar-left">
                  <select class="zoom-select" id="zoomSelect">
                    <option value="50">50%</option>
                    <option value="75">75%</option>
                    <option value="100" selected>100%</option>
                    <option value="125">125%</option>
                    <option value="150">150%</option>
                    <option value="200">200%</option>
                  </select>
                  <button class="toolbar-icon-btn" title="확대">
                    <img src="assets/page_add.svg" alt="page_add">
                  </button>
                  <button class="toolbar-icon-btn" title="축소">
                    <img src="assets/page_minus.svg" alt="page_minus">
                  </button>
                </div>

                <div class="toolbar-center">
                  <button class="page-nav-btn" id="prevPage">
                    <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
                      <path d="M9 2L4 6.5 9 11" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </button>
                  <div class="page-display-box">
                    <span id="curPage">1</span>
                    <span>/</span>
                    <span id="totalPage">3</span>
                  </div>
                  <button class="page-nav-btn" id="nextPage">
                    <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
                      <path d="M4 2l5 4.5L4 11" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </button>
                </div>

                <div class="toolbar-right">
                  <button class="btn-pdf-download" id="pdfBtn">
                    <img src="assets/PDF.svg" alt="PDF">
                    PDF 다운로드
                  </button>
                </div>
              </div>

              <div class="viewer-body">
                <div class="viewer-page-wrap" id="viewerPageWrap">
                  <div class="viewer-page" id="viewerPage"></div>
                </div>
              </div>

              <div class="viewer-thumbs">
                <button class="thumb-nav-btn" id="thumbPrev">
                  <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M13 4L7 10l6 6" stroke="#888EA0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
                <div class="thumb-list" id="thumbList"></div>
                <button class="thumb-nav-btn" id="thumbNext">
                  <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M7 4l6 6-6 6" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
              </div>

            </div>

            <!-- 우: 정보 패널 -->
            <div class="detail-info" id="detailInfo"></div>

          </div>
        </div>
      </main>

    </div>
  </div>

  <script src="doc-detail.js"></script>
  <script src="dashboard-helper.js"></script>
</body>
</html>
