<html lang="ko">

<body class="page-admin">

  <div class="admin-wrap">

    <!-- ── 사이드바 ── -->

      <a href="dashboard.html" class="admin-sidebar__logo">Sendit<span class="admin-sidebar__badge">ADMIN</span></a>
      <nav class="admin-nav">
        <a href="dashboard.html" class="admin-nav-item">

          템플릿 관리
        </a>
      </nav>
      <div class="admin-sidebar__footer">
        <button class="admin-logout-btn" onclick="window.location.href='login.html'">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          로그아웃
        </button>
      </div>
    </aside>

    <!-- ── 메인 ── -->
    <div class="admin-main">

      <header class="admin-header">
        <span class="admin-header__title">회원 관리</span>
        <span class="admin-header__admin">관리자: <strong>admin</strong></span>
      </header>

      <div class="admin-content">

        <!-- 툴바 -->
        <div class="admin-toolbar">
          <input type="text" class="admin-search-input" placeholder="이름, 이메일로 검색" />
          <select class="admin-filter-select">
            <option value="all">가입 방법: 전체</option>
            <option value="email">이메일</option>
            <option value="kakao">카카오</option>
            <option value="naver">네이버</option>
            <option value="google">구글</option>
          </select>
          <select class="admin-filter-select">
            <option value="all">상태: 전체</option>
            <option value="active">활성</option>
            <option value="inactive">정지</option>
          </select>
        </div>

        <!-- 테이블 -->
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>이름</th>
                <th>이메일</th>
                <th>가입 방법</th>
                <th>가입일</th>
                <th>발송 건수</th>
                <th>총 결제</th>
                <th>상태</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>홍길동</td>
                <td>hong@example.com</td>
                <td>이메일</td>
                <td>2026.01.15</td>
                <td>12</td>
                <td>198,000원</td>
                <td><span class="status-badge status-badge--active">활성</span></td>
                <td><a href="members-detail.html" class="tbl-btn">보기</a></td>
              </tr>
              <tr>
                <td>김민준</td>
                <td>kim@example.com</td>
                <td>카카오</td>
                <td>2026.02.03</td>
                <td>3</td>
                <td>49,500원</td>
                <td><span class="status-badge status-badge--active">활성</span></td>
                <td><a href="members-detail.html" class="tbl-btn">보기</a></td>
              </tr>
              <tr>
                <td>이영희</td>
                <td>lee@example.com</td>
                <td>구글</td>
                <td>2025.12.20</td>
                <td>7</td>
                <td>118,800원</td>
                <td><span class="status-badge status-badge--inactive">정지</span></td>
                <td><a href="members-detail.html" class="tbl-btn">보기</a></td>
              </tr>
              <tr>
                <td>박철수</td>
                <td>park@example.com</td>
                <td>네이버</td>
                <td>2026.01.28</td>
                <td>1</td>
                <td>9,900원</td>
                <td><span class="status-badge status-badge--active">활성</span></td>
                <td><a href="members-detail.html" class="tbl-btn">보기</a></td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="admin-pagination">
          <button class="page-btn active">1</button>
          <button class="page-btn">2</button>
          <button class="page-btn">3</button>
        </div>

      </div>
    </div>

  </div>

</body>
</html>
