<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>발송 내역 – Lawsign 관리자</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Arimo:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
  <link rel="stylesheet" href="admin-history.css" />
</head>
<body class="page-admin">

  <div class="adm-layout">
    <aside class="adm-sidebar" id="admSidebar"></aside>
    <div class="adm-body">
      <header class="adm-topbar" id="admTopbar"></header>
      <main class="adm-content">

        <!-- 통계 카드 -->
        <div class="adh-stat-row">
          <div class="adh-stat-card">
            <div class="adh-stat-label">오늘 발송</div>
            <div class="adh-stat-value"><span id="adhStatToday">0</span><span class="adh-stat-unit">건</span></div>
          </div>
          <div class="adh-stat-card">
            <div class="adh-stat-label">이번 주 발송</div>
            <div class="adh-stat-value"><span id="adhStatWeek">0</span><span class="adh-stat-unit">건</span></div>
          </div>
          <div class="adh-stat-card">
            <div class="adh-stat-label">이번 달 발송</div>
            <div class="adh-stat-value"><span id="adhStatMonth">0</span><span class="adh-stat-unit">건</span></div>
          </div>
        </div>

        <!-- 메인 카드 -->
        <div class="adh-card">

          <!-- 검색 바 -->
          <div class="adh-search-bar">
            <div class="adh-filters">
              <!-- 발송 방법 드롭다운 -->
              <div class="adh-select" id="adhSelChannel">
                <span class="adh-select-label">발송 방법</span>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="#A4A5A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <div class="adh-dropdown" id="adhDropChannel">
                  <div class="adh-dropdown-item adh-dropdown-item--active" data-value="">전체</div>
                  <div class="adh-dropdown-item" data-value="simple">카카오 알림톡</div>
                  <div class="adh-dropdown-item" data-value="certified">카카오 전자문서</div>
                </div>
              </div>
              <!-- 상태 드롭다운 -->
              <div class="adh-select" id="adhSelStatus">
                <span class="adh-select-label">상태</span>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="#A4A5A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <div class="adh-dropdown" id="adhDropStatus">
                  <div class="adh-dropdown-item adh-dropdown-item--active" data-value="">전체</div>
                  <div class="adh-dropdown-item" data-value="sent">발송됨</div>
                  <div class="adh-dropdown-item" data-value="read">열람됨</div>
                  <div class="adh-dropdown-item" data-value="failed">발송 실패</div>
                </div>
              </div>
              <!-- 날짜 검색 -->
              <div class="adh-date-wrap">
                <input type="date" class="adh-date-input" id="adhDateFrom" />
                <span class="adh-date-sep">~</span>
                <input type="date" class="adh-date-input" id="adhDateTo" />
              </div>
              <!-- 검색 인풋 -->
              <div class="adh-search-input-wrap">
                <input type="text" class="adh-search-input" id="adhSearchInput" placeholder="검색어를 입력해주세요." />
                <svg class="adh-search-icon" width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="8.5" cy="8.5" r="5" stroke="#1C1E21" stroke-width="1.5" opacity="0.7"/><path d="M13 13l3.5 3.5" stroke="#1C1E21" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/></svg>
              </div>
            </div>
            <button class="adh-search-btn" id="adhSearchBtn">검색</button>
          </div>

          <!-- 테이블 카운트 -->
          <div class="adh-table-meta">
            <span class="adh-table-count">전체 <strong id="adhCount">0</strong>건</span>
          </div>

          <!-- 테이블 -->
          <div class="adh-table-wrap">
            <table class="adh-table">
              <thead>
                <tr>
                  <th style="width:5%;">No.</th>
                  <th style="width:10%;">발신인</th>
                  <th style="width:11%;">문서 유형</th>
                  <th style="width:18%;">수신인</th>
                  <th style="width:17%;">발송 방법</th>
                  <th style="width:9%;">상태</th>
                  <th style="width:11%;">발송일</th>
                  <th style="width:10%;">관리</th>
                </tr>
              </thead>
              <tbody id="adhTbody"></tbody>
            </table>
          </div>

          <!-- 페이지네이션 -->
          <div class="adh-pagination">
            <div class="adh-page-info" id="adhPageInfo"></div>
            <div class="adh-page-nav" id="adhPageNav"></div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="admin-data.js"></script>
  <script src="admin-helper.js"></script>
  <script src="admin-history.js"></script>
</body>
</html>
