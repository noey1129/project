<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회원 관리 – Lawsign 관리자</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Arimo:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
  <link rel="stylesheet" href="admin-members.css" />
</head>
<body class="page-admin">

  <div class="adm-layout">
    <aside class="adm-sidebar" id="admSidebar"></aside>
    <div class="adm-body">
      <header class="adm-topbar" id="admTopbar"></header>
      <main class="adm-content">

        <div class="mem-card">
          <!-- 검색 바 -->
          <div class="mem-search-bar">
            <div class="mem-filters">
              <div class="mem-select" id="filterMethod">
                <span class="mem-select-label">가입방법</span>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="#A4A5A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <div class="mem-dropdown" id="dropMethod">
                  <div class="mem-dropdown-item mem-dropdown-item--active" data-value="">전체</div>
                  <div class="mem-dropdown-item" data-value="이메일">이메일</div>
                  <div class="mem-dropdown-item" data-value="카카오">카카오</div>
                  <div class="mem-dropdown-item" data-value="네이버">네이버</div>
                </div>
              </div>
              <div class="mem-select" id="filterStatus">
                <span class="mem-select-label">상태</span>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="#A4A5A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <div class="mem-dropdown" id="dropStatus">
                  <div class="mem-dropdown-item mem-dropdown-item--active" data-value="">전체</div>
                  <div class="mem-dropdown-item" data-value="활성">활성</div>
                  <div class="mem-dropdown-item" data-value="정지">정지</div>
                  <div class="mem-dropdown-item" data-value="탈퇴">탈퇴</div>
                </div>
              </div>
              <div class="mem-select mem-select--range" id="filterRange">
                <span class="mem-select-label">전체</span>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="#A4A5A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <div class="mem-dropdown" id="dropRange">
                  <div class="mem-dropdown-item mem-dropdown-item--active" data-value="">전체</div>
                  <div class="mem-dropdown-item" data-value="7">최근 7일</div>
                  <div class="mem-dropdown-item" data-value="30">최근 30일</div>
                  <div class="mem-dropdown-item" data-value="90">최근 90일</div>
                </div>
              </div>
              <div class="mem-search-input-wrap">
                <input type="text" class="mem-search-input" id="searchInput" placeholder="검색어를 입력해주세요." />
                <svg class="mem-search-icon" width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="8.5" cy="8.5" r="5" stroke="#1C1E21" stroke-width="1.5" opacity="0.7"/><path d="M13 13l3.5 3.5" stroke="#1C1E21" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/></svg>
              </div>
            </div>
            <button class="mem-search-btn" id="searchBtn">검색</button>
          </div>

          <!-- 테이블 -->
          <div class="mem-table-wrap">
            <table class="mem-table">
              <thead>
                <tr>
                  <th style="width:5%;">No.</th>
                  <th style="width:10%;">이름</th>
                  <th style="width:9%;">가입방법</th>
                  <th style="width:22%;">이메일</th>
                  <th style="width:11%;">가입일</th>
                  <th style="width:9%;">상태</th>
                  <th style="width:8%;">발송건수</th>
                  <th style="width:16%;">관리</th>
                </tr>
              </thead>
              <tbody id="memTbody"></tbody>
            </table>
          </div>

          <!-- 페이지네이션 -->
          <div class="mem-pagination">
            <div class="mem-page-info" id="memPageInfo"></div>
            <div class="mem-page-nav" id="memPageNav"></div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- 메모 모달 -->
  <div class="mem-modal-overlay" id="memoOverlay">
    <div class="mem-modal">
      <div class="mem-modal-top">
        <span class="mem-modal-title">메모 작성</span>
        <button class="mem-modal-close" id="memoClose">✕</button>
      </div>
      <hr class="mem-modal-divider" />
      <!-- 대상 회원 정보 -->
      <div class="mem-memo-member">
        <div class="mem-memo-avatar" id="memoAvatar"></div>
        <div>
          <div class="mem-memo-member-name" id="memoMemberName"></div>
          <div class="mem-memo-member-email" id="memoMemberEmail"></div>
        </div>
      </div>
      <div class="mem-memo-label">메모 내용</div>
      <textarea class="mem-memo-textarea" id="memoText" placeholder="관리자 메모를 입력하세요." maxlength="300"></textarea>
      <div class="mem-memo-char-count"><span id="memoCharCount">0</span> / 300</div>
      <div class="mem-modal-footer">
        <button class="mem-memo-cancel" id="memoCancel">취소</button>
        <button class="mem-memo-save" id="memoSave">저장</button>
      </div>
    </div>
  </div>


  <script src="admin-members-data.js"></script>
  <script src="admin-helper.js"></script>
  <script src="admin-members.js"></script>
</body>
</html>
