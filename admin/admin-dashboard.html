<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>대시보드 – Lawsign 관리자</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Arimo:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="page-admin">

  <div class="adm-layout">
    <!-- 사이드바 -->
    <aside class="adm-sidebar" id="admSidebar"></aside>

    <!-- 메인 -->
    <div class="adm-body">
      <!-- 탑바 -->
      <header class="adm-topbar" id="admTopbar"></header>

      <!-- 컨텐츠 -->
      <main class="adm-content">

        <!-- 통계 카드 4개 -->
        <div class="adm-stat-grid">
          <div class="adm-stat-card">
            <div class="adm-stat-label">이번 달 매출</div>
            <div class="adm-stat-value">3,284,200</div>
            <div class="adm-stat-change">▲ 전월 대비 12.4% 증가</div>
          </div>
          <div class="adm-stat-card">
            <div class="adm-stat-label">이번 달 발송 건수</div>
            <div class="adm-stat-value">248</div>
            <div class="adm-stat-change">▲ 전월 대비 8.3% 증가</div>
          </div>
          <div class="adm-stat-card">
            <div class="adm-stat-label">이번 달 신규가입 회원</div>
            <div class="adm-stat-value">1,042</div>
            <div class="adm-stat-change">▲ 전월 대비 34명 증가</div>
          </div>
          <div class="adm-stat-card">
            <div class="adm-stat-label">금일 발송 건수</div>
            <div class="adm-stat-value">32</div>
            <div class="adm-stat-change adm-stat-change--down">▼ 전일 대비 3건 감소</div>
          </div>
        </div>

        <!-- 차트 행 -->
        <div class="adm-chart-row">
          <!-- 발송 방식 비율 (도넛) -->
          <div class="adm-donut-card">
            <div class="adm-chart-title">발송 방식 비율</div>
            <!-- JS로 렌더링 -->
            <div class="adm-donut-wrap" id="admDonutWrap"></div>
          </div>

          <!-- 최근 7일 발송 현황 (막대) -->
          <div class="adm-bar-card">
            <div class="adm-chart-title">최근 7일 발송 현황</div>
            <div class="adm-bar-chart" id="admBarChart"></div>
          </div>
        </div>

        <!-- 최근 발송 내역 -->
        <div class="adm-table-card">
          <div class="adm-table-header">
            <div class="adm-chart-title">최근 발송 내역</div>
            <button class="adm-more-btn">더보기</button>
          </div>
          <table class="adm-table" id="admRecentTable">
            <thead>
              <tr>
                <th>발송인</th>
                <th>문서 내용</th>
                <th>발송 방법</th>
                <th>상태</th>
                <th>발송일자</th>
              </tr>
            </thead>
            <tbody id="admRecentTbody"></tbody>
          </table>
        </div>

      </main>
    </div>
  </div>

  <!-- 자세히 보기 모달 -->
  <div class="adm-modal-overlay" id="admDetailOverlay">
    <div class="adm-modal">
      <div class="adm-modal-top">
        <span class="adm-modal-title">발송 내역 상세</span>
        <button class="adm-modal-close" id="admModalClose">✕</button>
      </div>
      <hr class="adm-modal-divider" />
      <div class="adm-modal-body">
        <div class="adm-modal-row">
          <span class="adm-modal-key">발송인</span>
          <span class="adm-modal-val" id="mdSender"></span>
        </div>
        <div class="adm-modal-row">
          <span class="adm-modal-key">문서 유형</span>
          <span class="adm-modal-val" id="mdType"></span>
        </div>
        <div class="adm-modal-row">
          <span class="adm-modal-key">내용</span>
          <span class="adm-modal-val">내용증명을 발송했습니다.</span>
        </div>
        <div class="adm-modal-row">
          <span class="adm-modal-key">발송 방법</span>
          <span class="adm-modal-val" id="mdMethod"></span>
        </div>
        <div class="adm-modal-row">
          <span class="adm-modal-key">상태</span>
          <span class="adm-modal-val" id="mdStatus"></span>
        </div>
        <div class="adm-modal-row">
          <span class="adm-modal-key">발송일자</span>
          <span class="adm-modal-val" id="mdDate"></span>
        </div>
      </div>
    </div>
  </div>

  <script src="admin-data.js"></script>
  <script src="admin-helper.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {

      /* ── 발송 방식 비율 (도넛) ── */
      var certifiedCount = ADMIN_DOCS.filter(function (d) { return d.sendMethod === 'certified'; }).length;
      var simpleCount    = ADMIN_DOCS.length - certifiedCount;
      var total          = ADMIN_DOCS.length;
      var certPct        = total ? Math.round(certifiedCount / total * 100) : 0;
      var simplePct      = 100 - certPct;

      document.getElementById('admDonutWrap').innerHTML =
        '<div class="adm-donut" style="background:conic-gradient(#FC9950 0% ' + simplePct + '%, #2B3347 ' + simplePct + '% 100%);">' +
          '<div class="adm-donut-inner">' +
            '<span class="adm-donut-count">' + total + '</span>' +
            '<span class="adm-donut-sub">총 발송</span>' +
          '</div>' +
        '</div>' +
        '<div class="adm-legend">' +
          '<div class="adm-legend-item">' +
            '<div class="adm-legend-label"><span class="adm-legend-dot" style="background:#2B3347;"></span>카카오 전자문서</div>' +
            '<div><span class="adm-legend-count">' + certifiedCount + '건</span><span class="adm-legend-pct">(' + certPct + '%)</span></div>' +
          '</div>' +
          '<div class="adm-legend-item">' +
            '<div class="adm-legend-label"><span class="adm-legend-dot" style="background:#FC9950;"></span>카카오 알림톡</div>' +
            '<div><span class="adm-legend-count">' + simpleCount + '건</span><span class="adm-legend-pct">(' + simplePct + '%)</span></div>' +
          '</div>' +
        '</div>';

      /* ── 최근 7일 발송 현황 (막대) ── */
      var today = new Date();
      today.setHours(0, 0, 0, 0);
      var days = [];
      for (var i = 6; i >= 0; i--) {
        var d = new Date(today);
        d.setDate(d.getDate() - i);
        var yyyy = d.getFullYear();
        var mm   = String(d.getMonth() + 1).padStart(2, '0');
        var dd   = String(d.getDate()).padStart(2, '0');
        days.push({ key: yyyy + '-' + mm + '-' + dd, label: (d.getMonth() + 1) + '/' + d.getDate(), count: 0, isToday: i === 0 });
      }
      ADMIN_DOCS.forEach(function (doc) {
        var day = days.find(function (d) { return d.key === doc.sendDate; });
        if (day) day.count++;
      });

      var maxCount = Math.max.apply(null, days.map(function (d) { return d.count; }));
      var MAX_H    = 200;
      var yMax     = maxCount < 5 ? 5 : (Math.ceil(maxCount / 5) * 5);
      var yStep    = Math.round(yMax / 4);
      var yLabels  = [yMax, yMax - yStep, yMax - yStep * 2, yMax - yStep * 3, 0];

      var yAxisHTML = yLabels.map(function (v) { return '<span>' + v + '</span>'; }).join('');
      var colsHTML  = days.map(function (day) {
        var h      = maxCount > 0 ? Math.round((day.count / maxCount) * MAX_H) : 0;
        var cls    = day.isToday ? ' adm-bar-rect--today' : '';
        var numCls = day.isToday ? ' adm-bar-num--today' : '';
        return '<div class="adm-bar-col">' +
          '<span class="adm-bar-num' + numCls + '">' + day.count + '</span>' +
          '<div class="adm-bar-rect' + cls + '" style="height:' + (h || 2) + 'px;"></div>' +
          '<span class="adm-bar-date">' + day.label + '</span>' +
        '</div>';
      }).join('');

      document.getElementById('admBarChart').innerHTML =
        '<div class="adm-bar-yaxis">' + yAxisHTML + '</div>' +
        '<div class="adm-bar-cols">' + colsHTML + '</div>';

      /* ── 최근 발송 내역 테이블 (최신순 7건) ── */
      var recent = ADMIN_DOCS.slice().sort(function (a, b) { return b.sendDate.localeCompare(a.sendDate); }).slice(0, 7);
      var methodLabel    = { certified: '카카오 전자문서', simple: '카카오 알림톡' };
      var methodCls      = { certified: 'adm-table-method--certified', simple: 'adm-table-method--simple' };
      var modalMethodCls = { certified: 'adm-modal-val--certified', simple: 'adm-modal-val--simple' };

      var statusLabel = { sent: '발송됨', read: '열람됨', failed: '발송 실패' };
      var statusCls   = { sent: 'adm-status--sent', read: 'adm-status--read', failed: 'adm-status--failed' };

      var tbody = document.getElementById('admRecentTbody');
      tbody.innerHTML = recent.map(function (doc) {
        var stLabel  = statusLabel[doc.status] || doc.status;
        var stCls    = statusCls[doc.status]   || '';
        var stHTML   = '<span class="adm-status ' + stCls + '">' + stLabel + '</span>';
        var dateStr  = doc.sendDate.replace(/-/g, '. ');
        return '<tr' +
          ' data-sender="'     + doc.sender                 + '"' +
          ' data-type="'       + doc.type                   + '"' +
          ' data-type-cls="'   + doc.typeCls                + '"' +
          ' data-method="'     + methodLabel[doc.sendMethod] + '"' +
          ' data-method-cls="' + methodCls[doc.sendMethod]   + '"' +
          ' data-status="'     + stLabel + '"' +
          ' data-status-cls="' + stCls   + '"' +
          ' data-date="'       + dateStr                    + '">' +
          '<td>' + doc.sender + '</td>' +
          '<td><span class="adm-type-badge ' + doc.typeCls + '">' + doc.type + '</span>&nbsp; 내용증명을 발송했습니다.</td>' +
          '<td class="' + methodCls[doc.sendMethod] + '">' + methodLabel[doc.sendMethod] + '</td>' +
          '<td>' + stHTML + '</td>' +
          '<td>' + dateStr + '</td>' +
        '</tr>';
      }).join('');

      /* ── 더보기 ── */
      document.querySelector('.adm-more-btn').addEventListener('click', function () {
        window.location.href = 'admin-history.html';
      });

      /* ── 행 클릭 → 모달 ── */
      var overlay = document.getElementById('admDetailOverlay');
      tbody.addEventListener('click', function (e) {
        var row = e.target.closest('tr');
        if (!row) return;
        document.getElementById('mdSender').textContent = row.dataset.sender;
        document.getElementById('mdType').innerHTML = '<span class="adm-type-badge ' + row.dataset.typeCls + '">' + row.dataset.type + '</span>';
        var methodEl = document.getElementById('mdMethod');
        methodEl.className = 'adm-modal-val ' + (row.dataset.methodCls === 'adm-table-method--certified' ? 'adm-modal-val--certified' : 'adm-modal-val--simple');
        methodEl.textContent = row.dataset.method;
        var statusEl = document.getElementById('mdStatus');
        statusEl.innerHTML = '<span class="adm-status ' + row.dataset.statusCls + '">' + row.dataset.status + '</span>';
        document.getElementById('mdDate').textContent   = row.dataset.date;
        overlay.classList.add('adm-modal-overlay--open');
      });

      /* ── 모달 닫기 ── */
      function closeModal() { overlay.classList.remove('adm-modal-overlay--open'); }
      document.getElementById('admModalClose').addEventListener('click', closeModal);
      overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal(); });
    });
  </script>
</body>
</html>
