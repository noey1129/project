    <div class="page-body">
      <div class="container-xl">

        <div class="card">
          <div class="card-header">
            <div class="col-12">
              <ul class="nav nav-tabs card-header-tabs" id="templateTabs" role="tablist">

          <div class="card-body">
            <div class="alert alert-info mb-4" role="alert">
              <div class="d-flex align-items-start gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-sm mt-1 flex-shrink-0" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12.01" y2="8"/><polyline points="11 12 12 12 12 16 13 16"/></svg>
                <div>
                  이 문구는 사용자가 질문 답변을 완료한 후 미리보기 화면에서 보게 되는 자동 생성 내용의 기반입니다.
                  <code class="ms-1">{변수명}</code> 형식으로 사용자의 답변이 삽입됩니다.
                </div>
              </div>
            </div>

            <div class="tab-content" id="templateTabContent">

              <!-- 임대차 -->
              <div class="tab-pane fade show active" id="panel-rent" role="tabpanel" aria-labelledby="tab-rent">
                <div class="mb-3">
                  <label class="form-label fw-medium">임대차 기본 문구</label>
                  <textarea class="form-control font-monospace" rows="8" id="tpl-rent" style="font-size:13px;line-height:1.8;">본인은 귀하와 임대차 계약을 체결하였으나, 계약 기간 만료 후 보증금 반환이 이루어지지 않고 있습니다.

[계약 내용]
- 계약 체결일: {contractDate}
- 임대차 대상: {address}
- 임대차 기간: {leaseStart} ~ {leaseEnd}
- 임대차 보증금: {deposit}원

이에 본 내용증명 수령일로부터 {deadline}일 이내에 위 보증금 전액을 반환하실 것을 강력히 촉구합니다.

만약 위 기한 내에 이행하지 않을 경우, 보증금반환청구소송 등 법적 절차를 진행할 것임을 통보합니다.</textarea>
                </div>
                <div class="d-flex gap-2">
                  <button class="btn btn-primary" onclick="saveTemplate('임대차')">
                    <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M6 4h10l4 4v10a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2"/><circle cx="12" cy="14" r="2"/><polyline points="14 4 14 8 8 8 8 4"/></svg>
                    저장
                  </button>
                  <button class="btn btn-outline-secondary" onclick="resetTemplate('rent')">
                    <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 7h3a1 1 0 0 0 1 -1v-1a2 2 0 0 1 4 0v1a1 1 0 0 0 1 1h3a1 1 0 0 1 1 1v7a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-7a1 1 0 0 1 1 -1"/></svg>
                    기본값으로
                  </button>
                </div>
              </div>

              <!-- 대여금 -->
              <div class="tab-pane fade" id="panel-loan" role="tabpanel" aria-labelledby="tab-loan">
                <div class="mb-3">
                  <label class="form-label fw-medium">대여금 기본 문구</label>
                  <textarea class="form-control font-monospace" rows="8" id="tpl-loan" style="font-size:13px;line-height:1.8;">본인은 귀하에게 금액을 대여하였으나 변제가 이루어지지 않고 있습니다.

[대여 내용]
- 대여일: {ldate}
- 대여 금액: {amount}원
- 변제 기한: {dueDate}

이에 본 내용증명 수령일로부터 {deadline}일 이내에 위 대여금 전액을 변제할 것을 촉구합니다.

만약 위 기한 내에 변제하지 않을 경우, 대여금반환청구소송 등 법적 절차를 진행할 것임을 통보합니다.</textarea>
                </div>
                <div class="d-flex gap-2">
                  <button class="btn btn-primary" onclick="saveTemplate('대여금')">
                    <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M6 4h10l4 4v10a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2"/><circle cx="12" cy="14" r="2"/><polyline points="14 4 14 8 8 8 8 4"/></svg>
                    저장
                  </button>
                  <button class="btn btn-outline-secondary" onclick="resetTemplate('loan')">
                    <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 7h3a1 1 0 0 0 1 -1v-1a2 2 0 0 1 4 0v1a1 1 0 0 0 1 1h3a1 1 0 0 1 1 1v7a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-7a1 1 0 0 1 1 -1"/></svg>
                    기본값으로
                  </button>
                </div>
              </div>

              <!-- 층간소음 -->
              <div class="tab-pane fade" id="panel-noise" role="tabpanel" aria-labelledby="tab-noise">
                <div class="mb-3">
                  <label class="form-label fw-medium">층간소음 기본 문구</label>
                  <textarea class="form-control font-monospace" rows="8" id="tpl-noise" style="font-size:13px;line-height:1.8;">본인은 귀하로 인한 층간소음 피해로 인하여 본 내용증명을 발송합니다.

[소음 피해 내용]
- 소음 유형: {noiseType}
- 피해 기간: {noisePeriod}
- 상세 내용: {desc}

이에 본 내용증명 수령일로부터 {deadline}일 이내에 소음 발생 행위를 중단할 것을 강력히 요구합니다.

위 기한 내에 시정되지 않을 경우, 층간소음이웃사이센터 신고 및 손해배상청구 등 관련 법적 조치를 취할 것임을 통보합니다.</textarea>
                </div>
                <div class="d-flex gap-2">
                  <button class="btn btn-primary" onclick="saveTemplate('층간소음')">
                    <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M6 4h10l4 4v10a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2"/><circle cx="12" cy="14" r="2"/><polyline points="14 4 14 8 8 8 8 4"/></svg>
                    저장
                  </button>
                  <button class="btn btn-outline-secondary" onclick="resetTemplate('noise')">
                    <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 7h3a1 1 0 0 0 1 -1v-1a2 2 0 0 1 4 0v1a1 1 0 0 0 1 1h3a1 1 0 0 1 1 1v7a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-7a1 1 0 0 1 1 -1"/></svg>
                    기본값으로
                  </button>
                </div>
              </div>

              <!-- 계약관련 -->
              <div class="tab-pane fade" id="panel-contract" role="tabpanel" aria-labelledby="tab-contract">
                <div class="mb-3">
                  <label class="form-label fw-medium">계약관련 기본 문구</label>
                  <textarea class="form-control font-monospace" rows="8" id="tpl-contract" style="font-size:13px;line-height:1.8;">본인은 귀하와 체결한 계약에 관하여 아래와 같이 통보합니다.

[계약 위반 내용]
- 계약 체결일: {contractDate}
- 위반 사항: {situation}
- 발생일: {eventDate}

귀하의 위 행위는 계약 위반에 해당하며, 이에 본 내용증명 수령일로부터 {deadline}일 이내에 {demand}를 이행하실 것을 요구합니다.

기한 내 이행이 없을 경우, 계약해제 및 손해배상청구 등 법적 조치를 취할 것임을 통보합니다.</textarea>
                </div>
                <div class="d-flex gap-2">
                  <button class="btn btn-primary" onclick="saveTemplate('계약관련')">
                    <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M6 4h10l4 4v10a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2"/><circle cx="12" cy="14" r="2"/><polyline points="14 4 14 8 8 8 8 4"/></svg>
                    저장
                  </button>
                  <button class="btn btn-outline-secondary" onclick="resetTemplate('contract')">
                    <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 7h3a1 1 0 0 0 1 -1v-1a2 2 0 0 1 4 0v1a1 1 0 0 0 1 1h3a1 1 0 0 1 1 1v7a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-7a1 1 0 0 1 1 -1"/></svg>
                    기본값으로
                  </button>
                </div>
              </div>

              <!-- 회원권환불 -->
              <div class="tab-pane fade" id="panel-membership" role="tabpanel" aria-labelledby="tab-membership">
                <div class="mb-3">
                  <label class="form-label fw-medium">회원권환불 기본 문구</label>
                  <textarea class="form-control font-monospace" rows="8" id="tpl-membership" style="font-size:13px;line-height:1.8;">본인은 귀 시설의 회원권을 구매하였으나, 계약 해지 요청 후 환불이 이루어지지 않고 있습니다.

[회원권 계약 내용]
- 계약일: {contractDate}
- 회원권 종류: {membershipType}
- 결제 금액: {amount}원
- 해지 요청일: {cancelDate}

소비자분쟁해결기준에 따라 계약 해지 시 환불받을 권리가 있으며, 이에 본 내용증명 수령일로부터 {deadline}일 이내에 위 금액을 환불해 주실 것을 요구합니다.

기한 내 이행이 없을 경우, 소비자원 신고 및 환불청구소송 등 법적 조치를 취할 것임을 통보합니다.</textarea>
                </div>
                <div class="d-flex gap-2">
                  <button class="btn btn-primary" onclick="saveTemplate('회원권환불')">
                    <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M6 4h10l4 4v10a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2"/><circle cx="12" cy="14" r="2"/><polyline points="14 4 14 8 8 8 8 4"/></svg>
                    저장
                  </button>
                  <button class="btn btn-outline-secondary" onclick="resetTemplate('membership')">
                    <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 7h3a1 1 0 0 0 1 -1v-1a2 2 0 0 1 4 0v1a1 1 0 0 0 1 1h3a1 1 0 0 1 1 1v7a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-7a1 1 0 0 1 1 -1"/></svg>
                    기본값으로
                  </button>
                </div>
              </div>

              <!-- 직접작성 -->
              <div class="tab-pane fade" id="panel-custom" role="tabpanel" aria-labelledby="tab-custom">
                <div class="mb-3">
                  <label class="form-label fw-medium">직접작성 기본 안내 문구</label>
                  <textarea class="form-control font-monospace" rows="8" id="tpl-custom" style="font-size:13px;line-height:1.8;">본인은 귀하에 대하여 아래와 같이 통보합니다.

[사건 개요]
- 발생일: {eventDate}
- 내용: {situation}

<script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js"></script>
<script>
  if (!sessionStorage.getItem('admin_logged_in')) {
    window.location.href = 'login.html';
  }

  var defaults = {
    rent: '본인은 귀하와 임대차 계약을 체결하였으나, 계약 기간 만료 후 보증금 반환이 이루어지지 않고 있습니다.\n\n[계약 내용]\n- 계약 체결일: {contractDate}\n- 임대차 대상: {address}\n- 임대차 기간: {leaseStart} ~ {leaseEnd}\n- 임대차 보증금: {deposit}원\n\n이에 본 내용증명 수령일로부터 {deadline}일 이내에 위 보증금 전액을 반환하실 것을 강력히 촉구합니다.\n\n만약 위 기한 내에 이행하지 않을 경우, 보증금반환청구소송 등 법적 절차를 진행할 것임을 통보합니다.',
    loan: '본인은 귀하에게 금액을 대여하였으나 변제가 이루어지지 않고 있습니다.\n\n[대여 내용]\n- 대여일: {ldate}\n- 대여 금액: {amount}원\n- 변제 기한: {dueDate}\n\n이에 본 내용증명 수령일로부터 {deadline}일 이내에 위 대여금 전액을 변제할 것을 촉구합니다.\n\n만약 위 기한 내에 변제하지 않을 경우, 대여금반환청구소송 등 법적 절차를 진행할 것임을 통보합니다.',
    noise: '본인은 귀하로 인한 층간소음 피해로 인하여 본 내용증명을 발송합니다.\n\n[소음 피해 내용]\n- 소음 유형: {noiseType}\n- 피해 기간: {noisePeriod}\n- 상세 내용: {desc}\n\n이에 본 내용증명 수령일로부터 {deadline}일 이내에 소음 발생 행위를 중단할 것을 강력히 요구합니다.\n\n위 기한 내에 시정되지 않을 경우, 층간소음이웃사이센터 신고 및 손해배상청구 등 관련 법적 조치를 취할 것임을 통보합니다.',
    contract: '본인은 귀하와 체결한 계약에 관하여 아래와 같이 통보합니다.\n\n[계약 위반 내용]\n- 계약 체결일: {contractDate}\n- 위반 사항: {situation}\n- 발생일: {eventDate}\n\n귀하의 위 행위는 계약 위반에 해당하며, 이에 본 내용증명 수령일로부터 {deadline}일 이내에 {demand}를 이행하실 것을 요구합니다.\n\n기한 내 이행이 없을 경우, 계약해제 및 손해배상청구 등 법적 조치를 취할 것임을 통보합니다.',
    membership: '본인은 귀 시설의 회원권을 구매하였으나, 계약 해지 요청 후 환불이 이루어지지 않고 있습니다.\n\n[회원권 계약 내용]\n- 계약일: {contractDate}\n- 회원권 종류: {membershipType}\n- 결제 금액: {amount}원\n- 해지 요청일: {cancelDate}\n\n소비자분쟁해결기준에 따라 계약 해지 시 환불받을 권리가 있으며, 이에 본 내용증명 수령일로부터 {deadline}일 이내에 위 금액을 환불해 주실 것을 요구합니다.\n\n기한 내 이행이 없을 경우, 소비자원 신고 및 환불청구소송 등 법적 조치를 취할 것임을 통보합니다.',
    custom: '본인은 귀하에 대하여 아래와 같이 통보합니다.\n\n[사건 개요]\n- 발생일: {eventDate}\n- 내용: {situation}\n\n이에 본 내용증명 수령일로부터 {deadline}일 이내에 {demand}를 이행해 주시기 바랍니다.\n\n기한 내 이행이 없을 경우, 관련 법령에 따른 법적 조치를 취할 것임을 통보합니다.'
  };

  function saveTemplate(typeName) {
    // Show success toast via Tabler toast or alert
    var toast = document.getElementById('saveToast');
    if (toast) {
      document.getElementById('toastMessage').textContent = typeName + ' 템플릿이 저장되었습니다.';
      var bsToast = new bootstrap.Toast(toast);
      bsToast.show();
    } else {
      alert(typeName + ' 템플릿이 저장되었습니다.');
    }
  }

  function resetTemplate(key) {
    if (confirm('기본값으로 되돌리겠습니까? 현재 내용이 사라집니다.')) {
      var el = document.getElementById('tpl-' + key);
      if (el && defaults[key]) {
        el.value = defaults[key];
      }
    }
  }
</script>

<!-- Save Toast -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="saveToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body" id="toastMessage">
        템플릿이 저장되었습니다.
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  </div>
</div>
