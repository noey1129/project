<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>템플릿 관리 – Sendit 관리자</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="page-admin">

  <div class="admin-wrap">

    <!-- ── 사이드바 ── -->
    <aside class="admin-sidebar">
      <a href="dashboard.html" class="admin-sidebar__logo">Sendit<span class="admin-sidebar__badge">ADMIN</span></a>
      <nav class="admin-nav">
        <a href="dashboard.html" class="admin-nav-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          대시보드
        </a>
        <a href="members.html" class="admin-nav-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          회원 관리
        </a>
        <a href="sends.html" class="admin-nav-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          발송 내역
        </a>
        <a href="templates.html" class="admin-nav-item active">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          템플릿 관리
        </a>
      </nav>
      <div class="admin-sidebar__footer">
        <button class="admin-logout-btn" onclick="window.location.href='login.html'">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          로그아웃
        </button>
      </div>
    </aside>

    <!-- ── 메인 ── -->
    <div class="admin-main">

      <header class="admin-header">
        <span class="admin-header__title">템플릿 관리</span>
        <span class="admin-header__admin">관리자: <strong>admin</strong></span>
      </header>

      <div class="admin-content">

        <!-- 유형 탭 -->
        <div class="admin-type-tabs" id="typeTabs">
          <button class="admin-type-tab active" data-type="rent" onclick="switchType(this)">임대차</button>
          <button class="admin-type-tab" data-type="loan" onclick="switchType(this)">대여금</button>
          <button class="admin-type-tab" data-type="noise" onclick="switchType(this)">층간소음</button>
          <button class="admin-type-tab" data-type="contract" onclick="switchType(this)">계약관련</button>
          <button class="admin-type-tab" data-type="membership" onclick="switchType(this)">회원권환불</button>
          <button class="admin-type-tab" data-type="custom" onclick="switchType(this)">직접작성</button>
        </div>

        <!-- 템플릿 편집 -->
        <div class="admin-chart-card" style="max-width: 800px;">
          <div class="admin-chart-card__title" id="templateTitle">임대차 기본 문구</div>
          <p style="font-size:13px; color:#696B6D; margin:0;">
            이 문구는 사용자가 미리보기 화면에서 보게 되는 자동 생성 내용의 기반입니다.
            <code style="background:#F2F3F6; padding:2px 6px; border-radius:4px; font-size:12px;">{변수명}</code> 형식으로 질문 답변이 삽입됩니다.
          </p>
          <textarea class="admin-template-textarea" id="templateContent"></textarea>
          <div class="admin-template-actions">
            <button class="admin-save-btn" onclick="alert('저장 기능은 준비 중입니다.')">저장</button>
            <button class="admin-reset-btn" onclick="resetTemplate()">기본값으로 되돌리기</button>
          </div>
        </div>

      </div>
    </div>

  </div>

  <script>
    var templates = {
      rent: '제 목 : {subject}\n\n귀측(수신인, 이하 \'귀측\')의 건승과 무궁한 발전을 기원합니다.\n\n본 발신인은 아래와 같이 귀하와 임대차 계약을 체결하였음을 확인하며, 귀측에게 본 계약에 따른 임대차 보증금 반환의무가 있음을 알려드리는 바, 이에 대해 신속히 이행해 주시기를 촉구합니다.\n\n가. 본 계약의 주요 사항:\n    1) 계약 체결일 : {contractDate}\n    2) 임대차 대상 : {address}\n    3) 임대차 기간 : {leaseStart} ~ {leaseEnd}\n    4) 임대차 보증금 : {deposit}원',
      loan: '본인은 귀하에게 {ldate} 금 {amount}을 대여하였습니다.\n\n{dueDateClause}\n\n이에 본 내용증명 수령일로부터 {deadline}일 이내에 위 대여금 전액을 변제할 것을 촉구합니다.\n\n만약 위 기한 내에 변제하지 않을 경우, 법적 절차를 진행할 것임을 통보합니다.',
      noise: '본인은 귀하로 인한 층간소음({noiseType}) 피해로 인하여 본 내용증명을 발송합니다.\n\n{desc}\n\n이에 본 내용증명 수령일로부터 {deadline}일 이내에 소음 발생 행위를 중단할 것을 강력히 요구합니다.\n\n위 기한 내에 시정되지 않을 경우, 관련 법규에 따른 법적 조치를 취할 것임을 통보합니다.',
      contract: '{situation}\n\n위 사실은 {eventDate}에 발생하였습니다.\n\n{demand}\n\n본 내용증명 수령일로부터 {deadline}일 이내에 위 사항을 이행해 주시기 바랍니다.\n\n기한 내 이행이 없을 경우 법적 조치를 취할 것임을 통보합니다.',
      membership: '{situation}\n\n위 사실은 {eventDate}에 발생하였습니다.\n\n{demand}\n\n본 내용증명 수령일로부터 {deadline}일 이내에 환불을 이행해 주시기 바랍니다.\n\n기한 내 이행이 없을 경우 법적 조치를 취할 것임을 통보합니다.',
      custom: '{situation}\n\n위 사실은 {eventDate}에 발생하였습니다.\n\n{demand}\n\n본 내용증명 수령일로부터 {deadline}일 이내에 위 사항을 이행해 주시기 바랍니다.\n\n기한 내 이행이 없을 경우 법적 조치를 취할 것임을 통보합니다.',
    };

    var typeNames = {
      rent: '임대차', loan: '대여금', noise: '층간소음',
      contract: '계약관련', membership: '회원권환불', custom: '직접작성'
    };

    var currentType = 'rent';

    function switchType(el) {
      document.querySelectorAll('.admin-type-tab').forEach(function (t) { t.classList.remove('active'); });
      el.classList.add('active');
      currentType = el.dataset.type;
      document.getElementById('templateTitle').textContent = typeNames[currentType] + ' 기본 문구';
      document.getElementById('templateContent').value = templates[currentType];
    }

    function resetTemplate() {
      document.getElementById('templateContent').value = templates[currentType];
    }

    /* 초기화 */
    document.getElementById('templateContent').value = templates[currentType];
  </script>

</body>
</html>
