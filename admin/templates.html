  <main class="admin-main">
    <div class="admin-header">
      <span class="admin-header__title">템플릿 관리</span>
      <div class="admin-header__right">
        <span class="admin-header__admin">관리자: <strong>admin</strong></span>
      </div>
    </div>

    <div class="admin-content">

      <!-- 안내 -->
      <div class="admin-alert">
        이 문구는 사용자가 질문 답변을 완료한 후 미리보기 화면에서 보게 되는 자동 생성 내용의 기반입니다.
        <code style="background:#C8F0F2;padding:2px 6px;border-radius:3px;font-size:12px;">{변수명}</code> 형식으로 사용자의 답변이 삽입됩니다.
      </div>

      <!-- 탭 -->
      <div class="admin-type-tabs" id="typeTabs">
        <button class="admin-type-tab active" onclick="switchTab('rent', this)">임대차</button>
        <button class="admin-type-tab" onclick="switchTab('loan', this)">대여금</button>
        <button class="admin-type-tab" onclick="switchTab('noise', this)">층간소음</button>
        <button class="admin-type-tab" onclick="switchTab('contract', this)">계약관련</button>
        <button class="admin-type-tab" onclick="switchTab('membership', this)">회원권환불</button>
        <button class="admin-type-tab" onclick="switchTab('custom', this)">직접작성</button>
      </div>

      <!-- 템플릿 패널 -->
      <div class="admin-info-card">

        <!-- 임대차 -->
        <div class="tpl-panel" id="panel-rent">
          <label style="font-size:14px;font-weight:600;color:#333;display:block;margin-bottom:10px;">임대차 기본 문구</label>
          <textarea class="admin-template-textarea" id="tpl-rent">본인은 귀하와 임대차 계약을 체결하였으나, 계약 기간 만료 후 보증금 반환이 이루어지지 않고 있습니다.

[계약 내용]
- 계약 체결일: {contractDate}
- 임대차 대상: {address}
- 임대차 기간: {leaseStart} ~ {leaseEnd}
- 임대차 보증금: {deposit}원

이에 본 내용증명 수령일로부터 {deadline}일 이내에 위 보증금 전액을 반환하실 것을 강력히 촉구합니다.

만약 위 기한 내에 이행하지 않을 경우, 보증금반환청구소송 등 법적 절차를 진행할 것임을 통보합니다.</textarea>
          <div class="admin-template-actions" style="margin-top:12px;">
            <button class="admin-save-btn" onclick="saveTemplate('임대차')">저장</button>
            <button class="admin-reset-btn" onclick="resetTemplate('rent')">기본값으로</button>
          </div>
        </div>

        <!-- 대여금 -->
        <div class="tpl-panel" id="panel-loan" style="display:none;">
          <label style="font-size:14px;font-weight:600;color:#333;display:block;margin-bottom:10px;">대여금 기본 문구</label>
          <textarea class="admin-template-textarea" id="tpl-loan">본인은 귀하에게 금액을 대여하였으나 변제가 이루어지지 않고 있습니다.

[대여 내용]
- 대여일: {ldate}
- 대여 금액: {amount}원
- 변제 기한: {dueDate}

이에 본 내용증명 수령일로부터 {deadline}일 이내에 위 대여금 전액을 변제할 것을 촉구합니다.

만약 위 기한 내에 변제하지 않을 경우, 대여금반환청구소송 등 법적 절차를 진행할 것임을 통보합니다.</textarea>
          <div class="admin-template-actions" style="margin-top:12px;">
            <button class="admin-save-btn" onclick="saveTemplate('대여금')">저장</button>
            <button class="admin-reset-btn" onclick="resetTemplate('loan')">기본값으로</button>
          </div>
        </div>

        <!-- 층간소음 -->
        <div class="tpl-panel" id="panel-noise" style="display:none;">
          <label style="font-size:14px;font-weight:600;color:#333;display:block;margin-bottom:10px;">층간소음 기본 문구</label>
          <textarea class="admin-template-textarea" id="tpl-noise">본인은 귀하로 인한 층간소음 피해로 인하여 본 내용증명을 발송합니다.

[소음 피해 내용]
- 소음 유형: {noiseType}
- 피해 기간: {noisePeriod}
- 상세 내용: {desc}

이에 본 내용증명 수령일로부터 {deadline}일 이내에 소음 발생 행위를 중단할 것을 강력히 요구합니다.

위 기한 내에 시정되지 않을 경우, 층간소음이웃사이센터 신고 및 손해배상청구 등 관련 법적 조치를 취할 것임을 통보합니다.</textarea>
          <div class="admin-template-actions" style="margin-top:12px;">
            <button class="admin-save-btn" onclick="saveTemplate('층간소음')">저장</button>
            <button class="admin-reset-btn" onclick="resetTemplate('noise')">기본값으로</button>
          </div>
        </div>

        <!-- 계약관련 -->
        <div class="tpl-panel" id="panel-contract" style="display:none;">
          <label style="font-size:14px;font-weight:600;color:#333;display:block;margin-bottom:10px;">계약관련 기본 문구</label>
          <textarea class="admin-template-textarea" id="tpl-contract">본인은 귀하와 체결한 계약에 관하여 아래와 같이 통보합니다.

[계약 위반 내용]
- 계약 체결일: {contractDate}
- 위반 사항: {situation}
- 발생일: {eventDate}

귀하의 위 행위는 계약 위반에 해당하며, 이에 본 내용증명 수령일로부터 {deadline}일 이내에 {demand}를 이행하실 것을 요구합니다.

기한 내 이행이 없을 경우, 계약해제 및 손해배상청구 등 법적 조치를 취할 것임을 통보합니다.</textarea>
          <div class="admin-template-actions" style="margin-top:12px;">
            <button class="admin-save-btn" onclick="saveTemplate('계약관련')">저장</button>
            <button class="admin-reset-btn" onclick="resetTemplate('contract')">기본값으로</button>
          </div>
        </div>

        <!-- 회원권환불 -->
        <div class="tpl-panel" id="panel-membership" style="display:none;">
          <label style="font-size:14px;font-weight:600;color:#333;display:block;margin-bottom:10px;">회원권환불 기본 문구</label>
          <textarea class="admin-template-textarea" id="tpl-membership">본인은 귀 시설의 회원권을 구매하였으나, 계약 해지 요청 후 환불이 이루어지지 않고 있습니다.

[회원권 계약 내용]
- 계약일: {contractDate}
- 회원권 종류: {membershipType}
- 결제 금액: {amount}원
- 해지 요청일: {cancelDate}

소비자분쟁해결기준에 따라 계약 해지 시 환불받을 권리가 있으며, 이에 본 내용증명 수령일로부터 {deadline}일 이내에 위 금액을 환불해 주실 것을 요구합니다.

기한 내 이행이 없을 경우, 소비자원 신고 및 환불청구소송 등 법적 조치를 취할 것임을 통보합니다.</textarea>
          <div class="admin-template-actions" style="margin-top:12px;">
            <button class="admin-save-btn" onclick="saveTemplate('회원권환불')">저장</button>
            <button class="admin-reset-btn" onclick="resetTemplate('membership')">기본값으로</button>
          </div>
        </div>

        <!-- 직접작성 -->
        <div class="tpl-panel" id="panel-custom" style="display:none;">
          <label style="font-size:14px;font-weight:600;color:#333;display:block;margin-bottom:10px;">직접작성 기본 안내 문구</label>
          <textarea class="admin-template-textarea" id="tpl-custom">본인은 귀하에 대하여 아래와 같이 통보합니다.

[사건 개요]
- 발생일: {eventDate}
- 내용: {situation}

이에 본 내용증명 수령일로부터 {deadline}일 이내에 {demand}를 이행해 주시기 바랍니다.

기한 내 이행이 없을 경우, 관련 법령에 따른 법적 조치를 취할 것임을 통보합니다.</textarea>
          <div class="admin-template-actions" style="margin-top:12px;">
            <button class="admin-save-btn" onclick="saveTemplate('직접작성')">저장</button>
            <button class="admin-reset-btn" onclick="resetTemplate('custom')">기본값으로</button>
          </div>
        </div>

      </div>

    </div>
  </main>
</div>

<!-- 토스트 -->

    membership: '본인은 귀 시설의 회원권을 구매하였으나, 계약 해지 요청 후 환불이 이루어지지 않고 있습니다.\n\n[회원권 계약 내용]\n- 계약일: {contractDate}\n- 회원권 종류: {membershipType}\n- 결제 금액: {amount}원\n- 해지 요청일: {cancelDate}\n\n소비자분쟁해결기준에 따라 계약 해지 시 환불받을 권리가 있으며, 이에 본 내용증명 수령일로부터 {deadline}일 이내에 위 금액을 환불해 주실 것을 요구합니다.\n\n기한 내 이행이 없을 경우, 소비자원 신고 및 환불청구소송 등 법적 조치를 취할 것임을 통보합니다.',
    custom: '본인은 귀하에 대하여 아래와 같이 통보합니다.\n\n[사건 개요]\n- 발생일: {eventDate}\n- 내용: {situation}\n\n이에 본 내용증명 수령일로부터 {deadline}일 이내에 {demand}를 이행해 주시기 바랍니다.\n\n기한 내 이행이 없을 경우, 관련 법령에 따른 법적 조치를 취할 것임을 통보합니다.'
  };

  function switchTab(key, btn) {
    document.querySelectorAll('.tpl-panel').forEach(function(p) { p.style.display = 'none'; });
    document.querySelectorAll('.admin-type-tab').forEach(function(b) { b.classList.remove('active'); });
    document.getElementById('panel-' + key).style.display = '';
    btn.classList.add('active');
  }

  function saveTemplate(typeName) {
    var toast = document.getElementById('adminToast');
    toast.textContent = typeName + ' 템플릿이 저장되었습니다.';
    toast.classList.add('show');
    setTimeout(function() { toast.classList.remove('show'); }, 2500);
  }

  function resetTemplate(key) {
    if (confirm('기본값으로 되돌리겠습니까? 현재 내용이 사라집니다.')) {
      var el = document.getElementById('tpl-' + key);
      if (el && defaults[key]) { el.value = defaults[key]; }
    }
  }
</script>
<script src="admin-helper.js"></script>
</body>
</html>
