<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회원 상세 – Lawsign 관리자</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Arimo:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
  <link rel="stylesheet" href="admin-member-detail.css" />
</head>
<body class="page-admin">

  <div class="adm-layout">
    <aside class="adm-sidebar" id="admSidebar"></aside>
    <div class="adm-body">
      <header class="adm-topbar" id="admTopbar"></header>
      <main class="adm-content">

        <!-- 뒤로가기 + 정보수정 -->
        <div class="mdt-topnav">
          <a href="admin-members.html" class="mdt-back-btn">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12.5 15L7.5 10L12.5 5" stroke="#1C1E21" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            회원 목록
          </a>
        </div>

        <!-- 회원 헤더 카드 -->
        <div class="mdt-header-card">
          <div class="mdt-header-left">
            <div class="mdt-avatar" id="mdtAvatar"></div>
            <div class="mdt-header-info">
              <div class="mdt-member-name" id="mdtName"></div>
              <div class="mdt-member-email" id="mdtEmail"></div>
            </div>
          </div>
          <div class="mdt-header-right">
            <span class="mem-status-badge" id="mdtStatusBadge"></span>
          </div>
        </div>

        <!-- 2컬럼 그리드 -->
        <div class="mdt-grid">

          <!-- 왼쪽 컬럼 -->
          <div class="mdt-col-left">

            <!-- 기본 정보 -->
            <div class="mdt-card">
              <div class="mdt-card-title">기본 정보</div>
              <table class="mdt-info-table">
                <tbody>
                  <tr>
                    <td class="mdt-info-key">이름</td>
                    <td class="mdt-info-val" id="mdtInfoName"></td>
                  </tr>
                  <tr>
                    <td class="mdt-info-key">가입방법</td>
                    <td class="mdt-info-val" id="mdtInfoMethod"></td>
                  </tr>
                  <tr>
                    <td class="mdt-info-key">이메일</td>
                    <td class="mdt-info-val" id="mdtInfoEmail"></td>
                  </tr>
                  <tr>
                    <td class="mdt-info-key">가입일</td>
                    <td class="mdt-info-val" id="mdtInfoJoinDate"></td>
                  </tr>
                  <tr>
                    <td class="mdt-info-key">상태</td>
                    <td class="mdt-info-val" id="mdtInfoStatus"></td>
                  </tr>
                  <tr>
                    <td class="mdt-info-key">발송건수</td>
                    <td class="mdt-info-val" id="mdtInfoSendCount"></td>
                  </tr>
                </tbody>
              </table>
            </div>

            <!-- 사용 통계 -->
            <div class="mdt-card">
              <div class="mdt-card-title">사용 통계</div>
              <div class="mdt-stat-grid">
                <div class="mdt-stat-box">
                  <div class="mdt-stat-label">전체 발송</div>
                  <div class="mdt-stat-value" id="mdtStatTotal"></div>
                </div>
                <div class="mdt-stat-box">
                  <div class="mdt-stat-label">이번달 발송</div>
                  <div class="mdt-stat-value" id="mdtStatMonth"></div>
                </div>
              </div>
            </div>

          </div>

          <!-- 오른쪽 컬럼 -->
          <div class="mdt-col-right">

            <!-- 관리 액션 -->
            <div class="mdt-card">
              <div class="mdt-card-title">계정 관리</div>
              <div class="mdt-action-row">
                <div class="mdt-action-desc">
                  <div class="mdt-action-label">계정 상태 변경</div>
                  <div class="mdt-action-sub" id="mdtActionSub"></div>
                </div>
                <button class="mdt-action-btn" id="mdtToggleBtn"></button>
              </div>
              <div class="mdt-action-row mdt-action-row--danger">
                <div class="mdt-action-desc">
                  <div class="mdt-action-label">회원 탈퇴 처리</div>
                  <div class="mdt-action-sub">회원을 탈퇴 상태로 변경합니다.</div>
                </div>
                <button class="mdt-action-btn mdt-action-btn--danger" id="mdtWithdrawBtn">탈퇴 처리</button>
              </div>
            </div>

            <!-- 관리자 메모 -->
            <div class="mdt-card">
              <div class="mdt-card-title">관리자 메모</div>
              <textarea class="mdt-memo-textarea" id="mdtMemoText" placeholder="관리자 메모를 입력하세요." maxlength="300"></textarea>
              <div class="mdt-memo-footer">
                <span class="mdt-memo-char"><span id="mdtCharCount">0</span> / 300</span>
                <button class="mdt-memo-save-btn" id="mdtMemoSave">메모 저장</button>
              </div>
            </div>

          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- 상태 변경 확인 토스트 -->
  <div class="mdt-toast" id="mdtToast"></div>

  <script src="admin-members-data.js"></script>
  <script src="admin-data.js"></script>
  <script src="admin-helper.js"></script>
  <script src="admin-member-detail.js"></script>
</body>
</html>
