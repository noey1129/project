<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 로그인 – Sendit</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="../auth.css" />
</head>
<body class="page-auth">

  <main class="auth-main">
    <div class="auth-card" style="max-width:400px;">

      <div class="auth-header">
        <a href="../index.html" class="auth-logo" style="text-decoration:none;">Sendit</a>
        <span class="auth-tagline" style="background:#FFE8CC; color:#8B4513; padding:4px 12px; border-radius:20px; font-size:12px; font-weight:700;">관리자</span>
      </div>

      <form class="auth-form" id="adminLoginForm" onsubmit="return false;">
        <input
          type="text"
          id="adminId"
          class="auth-input"
          placeholder="관리자 ID"
          autocomplete="username"
        />
        <input
          type="password"
          id="adminPw"
          class="auth-input"
          placeholder="비밀번호"
          autocomplete="current-password"
        />
        <button type="button" class="btn-auth-submit" id="btnAdminLogin" disabled>로그인</button>
      </form>

      <div class="auth-footer-link" style="font-size:12px; color:#AFAFAF;">
        일반 사용자는 <a href="../login.html" style="color:#696B6D;">여기</a>에서 로그인하세요.
      </div>

      <!-- TODO: 테스트용 — 출시 전 제거 -->
      <div style="margin-top:20px; padding-top:16px; border-top:1px dashed #E7E9EB;">
        <button onclick="quickAdminLogin()" style="width:100%;padding:12px 16px;background:#F8F9FA;border:1px dashed #D7DBDF;border-radius:8px;font-size:13px;color:#696B6D;cursor:pointer;font-family:inherit;text-align:left;">
          🧪 테스트 관리자로 바로 로그인 &nbsp;<span style="color:#AFAFAF;">admin / admin1234</span>
        </button>
      </div>

    </div>
  </main>

  <script>
    var idInput = document.getElementById('adminId');
    var pwInput = document.getElementById('adminPw');
    var btn     = document.getElementById('btnAdminLogin');

    function checkReady() {
      btn.disabled = !(idInput.value.trim() && pwInput.value.trim());
    }
    idInput.addEventListener('input', checkReady);
    pwInput.addEventListener('input', checkReady);

    var ADMIN_ID = 'admin';
    var ADMIN_PW = 'admin1234';

    btn.addEventListener('click', function () {
      if (idInput.value.trim() === ADMIN_ID && pwInput.value === ADMIN_PW) {
        sessionStorage.setItem('admin_logged_in', 'true');
        sessionStorage.setItem('admin_name', '관리자');
        sessionStorage.setItem('admin_email', 'admin@sendit.kr');
        window.location.href = 'dashboard.html';
      } else {
        alert('관리자 ID 또는 비밀번호가 올바르지 않습니다.');
      }
    });

    function quickAdminLogin() {
      sessionStorage.setItem('admin_logged_in', 'true');
      sessionStorage.setItem('admin_name', '관리자');
      sessionStorage.setItem('admin_email', 'admin@sendit.kr');
      window.location.href = 'dashboard.html';
    }
  </script>

</body>
</html>
