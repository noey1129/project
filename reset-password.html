<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>비밀번호 재설정 – 로싸인</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body class="page-auth page-auth--login page-auth--top">

  <header class="nav"></header>

  <main class="auth-main">
    <div class="login-wrap">

      <!-- ── 1단계: 이메일 입력 ── -->
      <div id="viewInput">
        <div class="login-header" style="gap:40px;">
          <div style="display:flex; flex-direction:column; gap:10px;">
            <span class="login-logo"><img src="assets/Lawsign.svg" alt="Lawsign" height="38" /></span>
            <h1 class="login-title">비밀번호 재설정</h1>
          </div>
          <p class="find-account-desc">가입하신 이메일로 새 비밀번호를 설정할 수 있는<br/>링크가 전송돼요</p>
        </div>

        <form class="login-form" id="resetForm" onsubmit="return false;" style="margin-top:20px;">
          <div class="auth-field">
            <label class="auth-field-label" for="resetEmail">이메일</label>
            <input type="email" id="resetEmail" class="auth-input login-input" placeholder="이메일 주소" />
          </div>
          <div class="login-actions">
            <button type="submit" class="btn-login-submit" id="btnSendEmail" disabled>이메일 보내기</button>
          </div>
        </form>
      </div>

      <!-- ── 2단계: 전송 완료 ── -->
      <div id="viewSent" style="display:none;">
        <div style="display:flex; flex-direction:column; gap:40px;">
          <span class="login-logo"><img src="assets/Lawsign.svg" alt="Lawsign" height="38" /></span>
          <div style="display:flex; flex-direction:column; align-items:center; gap:30px;">
            <img src="assets/email.svg" width="80" height="80" alt="email" />
            <div style="display:flex; flex-direction:column; align-items:center; gap:20px;">
              <h2 class="reset-sent-title">비밀번호 재설정 이메일을 전송했어요.<br/>이메일을 확인해주세요.</h2>
              <p class="reset-sent-sub">이메일이 도착하지 않는다면 스팸함을 확인해주세요.</p>
            </div>
            <div style="display:flex; flex-direction:column; gap:20px; width:100%;">
              <hr class="reset-divider" />
              <p class="reset-resend-hint">아무리 기다려도 메일이 오지 않는다면</p>
              <button type="button" class="btn-resend-mail" id="btnResendMail">인증 메일 다시 받기</button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- ── 확인 팝업 (발송 전 확인) ── -->
  <div class="verify-modal-overlay" id="modalConfirm" style="display:none;">
    <div class="verify-modal">
      <div class="verify-modal-head">
        <div>
          <p class="verify-modal-title">비밀번호 초기화 요청</p>
          <p class="find-account-modal-sub">입력하신 이메일 주소로 비밀번호 초기화 요청을 하시겠습니까?</p>
        </div>
      </div>
      <div class="verify-modal-actions">
        <button type="button" class="verify-modal-btn verify-modal-btn--outline" id="btnConfirmCancel">취소</button>
        <button type="button" class="verify-modal-btn verify-modal-btn--fill" id="btnConfirmOk">확인</button>
      </div>
    </div>
  </div>

  <!-- ── 완료 팝업 (발송 후 안내) ── -->
  <div class="verify-modal-overlay" id="modalDone" style="display:none;">
    <div class="verify-modal">
      <div class="verify-modal-head">
        <div>
          <p class="verify-modal-title">비밀번호 초기화 요청이 완료하였습니다.</p>
          <p class="find-account-modal-sub">입력하신 이메일의 받은 편지함을 확인하세요.</p>
        </div>
      </div>
      <div class="verify-modal-actions" style="justify-content:center;">
        <button type="button" class="verify-modal-btn verify-modal-btn--fill" id="btnDoneOk">확인</button>
      </div>
    </div>
  </div>

  <!-- ── 재발송 팝업 ── -->
  <div class="verify-modal-overlay" id="modalResent" style="display:none;">
    <div class="verify-modal">
      <div class="verify-modal-head">
        <div>
          <p class="verify-modal-title" id="resentEmailTitle"></p>
          <p class="find-account-modal-sub">메일함을 확인해주세요</p>
        </div>
      </div>
      <div class="verify-modal-actions" style="justify-content:center;">
        <button type="button" class="verify-modal-btn verify-modal-btn--fill" id="btnResentOk">확인</button>
      </div>
    </div>
  </div>

  <script src="reset-password.js"></script>
  <script src="common-helper.js"></script>
</body>
</html>
