<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>마이페이지 – Sendit</title>
  <link rel="stylesheet" href="mypage.css" />
</head>
<body class="page-mypage">

<div class="mypage-wrap">

  <!-- 사이드바·헤더: dashboard-helper.js 가 주입 -->
  <main class="mypage-main">

    <div class="mypage-content">

      <!-- 통계 카드 -->
      <div class="mypage-stats">
        <div class="mypage-stat-card">
          <span class="mypage-stat-card__label">총 발송</span>
          <div class="mypage-stat-card__value">12<span class="mypage-stat-card__unit">건</span></div>
        </div>
        <div class="mypage-stat-card">
          <span class="mypage-stat-card__label">열람 완료</span>
          <div class="mypage-stat-card__value">9<span class="mypage-stat-card__unit">건</span></div>
        </div>
        <div class="mypage-stat-card">
          <span class="mypage-stat-card__label">열람 미확인</span>
          <div class="mypage-stat-card__value">3<span class="mypage-stat-card__unit">건</span></div>
        </div>
      </div>

      <!-- 필터 -->
      <div class="mypage-filter">
        <select class="mypage-filter-select" id="filterMethod" onchange="filterMySends()">
          <option value="">방식: 전체</option>
          <option value="전자문서">전자문서+공전소</option>
          <option value="알림톡">알림톡+공전소</option>
        </select>
        <select class="mypage-filter-select" id="filterStatus" onchange="filterMySends()">
          <option value="">상태: 전체</option>
          <option value="발송완료">발송완료</option>
          <option value="열람완료">열람완료</option>
          <option value="열람미확인">열람미확인</option>
          <option value="발송실패">발송실패</option>
        </select>
      </div>

      <!-- 발송 내역 테이블 -->
      <div class="mypage-table-wrap">
        <table class="mypage-table">
          <thead>
            <tr>
              <th>날짜</th>
              <th>유형</th>
              <th>수신인</th>
              <th>발송 방식</th>
              <th>상태</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="mySendsTableBody">
            <tr>
              <td style="color:#8C8C8C;">2026.02.28</td>
              <td>임대차</td>
              <td>김철수</td>
              <td><span class="method-badge-sm method-badge-sm--certified">전자문서+공전소</span></td>
              <td><span class="status-badge status-badge--read">열람완료</span></td>
              <td><a href="mypage-detail.html" class="tbl-btn">상세보기</a></td>
            </tr>
            <tr>
              <td style="color:#8C8C8C;">2026.02.15</td>
              <td>대여금</td>
              <td>이영희</td>
              <td><span class="method-badge-sm method-badge-sm--simple">알림톡+공전소</span></td>
              <td><span class="status-badge status-badge--sent">발송완료</span></td>
              <td><a href="mypage-detail.html" class="tbl-btn">상세보기</a></td>
            </tr>
            <tr>
              <td style="color:#8C8C8C;">2026.01.30</td>
              <td>층간소음</td>
              <td>박민준</td>
              <td><span class="method-badge-sm method-badge-sm--certified">전자문서+공전소</span></td>
              <td><span class="status-badge status-badge--pending">열람미확인</span></td>
              <td><a href="mypage-detail.html" class="tbl-btn">상세보기</a></td>
            </tr>
            <tr>
              <td style="color:#8C8C8C;">2026.01.10</td>
              <td>계약관련</td>
              <td>최지수</td>
              <td><span class="method-badge-sm method-badge-sm--simple">알림톡+공전소</span></td>
              <td><span class="status-badge status-badge--failed">발송실패</span></td>
              <td><a href="mypage-detail.html" class="tbl-btn">상세보기</a></td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- 페이지네이션 -->
      <div class="mypage-pagination">
        <button class="page-btn active">1</button>
        <button class="page-btn">2</button>
        <button class="page-btn">3</button>
      </div>

    </div>
  </main>

</div>

<script src="dashboard-helper.js"></script>
<script>
  function filterMySends() {
    var method = document.getElementById('filterMethod').value;
    var status = document.getElementById('filterStatus').value;
    var rows = document.querySelectorAll('#mySendsTableBody tr');
    rows.forEach(function (row) {
      var rowMethod = row.cells[3].textContent.trim();
      var rowStatus = row.cells[4].textContent.trim();
      var matchMethod = !method || rowMethod.includes(method);
      var matchStatus = !status || rowStatus.includes(status);
      row.style.display = (matchMethod && matchStatus) ? '' : 'none';
    });
  }
</script>

</body>
</html>
