<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 문서함 – 로싸인</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="dashboard.css" />
  <link rel="stylesheet" href="mypage.css" />
</head>
<body class="page-dashboard">

  <div class="db-layout">

    <!-- 사이드바 (dashboard-helper.js 삽입) -->
    <aside class="db-sidebar" id="dbSidebar"></aside>

    <!-- 메인 영역 -->
    <div class="db-body">

      <!-- 탑바 (dashboard-helper.js 삽입) -->
      <header class="db-topbar" id="dbTopbar"></header>

      <!-- 컨텐츠 -->
      <main class="db-content">
        <div class="db-card">

          <!-- 탭 -->
          <div class="doc-tabs">
            <button class="doc-tab doc-tab--active" data-tab="sent">보낸문서</button>
            <button class="doc-tab" data-tab="draft">임시보관</button>
          </div>

          <!-- 필터 -->
          <div class="doc-filter">
            <div class="doc-filter-left">
              <span class="doc-filter-label">작성자 / 내용</span>
              <select class="doc-select" id="filterType">
                <option value="all">전체</option>
                <option value="title">제목</option>
                <option value="recipient">수신인</option>
              </select>
              <span class="doc-filter-label">검색</span>
              <input type="text" class="doc-search-input" id="searchInput" placeholder="검색어를 입력해주세요." />
            </div>
            <button class="doc-search-btn" id="searchBtn">검색</button>
          </div>

          <!-- 문서 목록 -->
          <div class="doc-list" id="docList"></div>

        </div>
      </main>

    </div>
  </div>

  <script src="mypage.js"></script>
  <script src="dashboard-helper.js"></script>
</body>
</html>
