<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회원가입 – 로싸인</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body class="page-auth page-auth--login">

  <header class="nav"></header>

  <main class="auth-main">
    <div class="login-wrap">

      <!-- 로고 + 타이틀 -->
      <div class="login-header">
        <span class="login-logo"><img src="assets/Lawsign.svg" alt="Lawsign" height="38" /></span>
        <h1 class="login-title">회원가입</h1>
        <p class="signup-sub">계정 기본 정보를 입력해 주세요</p>
      </div>

      <!-- 회원가입 폼 -->
      <form class="login-form" id="signupForm" onsubmit="return false;">

        <div class="auth-field">
          <label class="auth-field-label" for="signupEmail">이메일</label>
          <input
            type="email"
            id="signupEmail"
            class="auth-input login-input"
            placeholder="ID로 사용될 이메일을 입력해 주세요"
            autocomplete="email"
          />
        </div>

        <div class="auth-field">
          <label class="auth-field-label" for="signupPassword">비밀번호</label>
          <input
            type="password"
            id="signupPassword"
            class="auth-input login-input"
            placeholder="영문, 숫자, 특수기호가 모두 들어간 8~16글자"
            autocomplete="new-password"
          />
          <input
            type="password"
            id="signupPasswordConfirm"
            class="auth-input login-input"
            placeholder="비밀번호를 한번 더 입력해 주세요"
            autocomplete="new-password"
          />
          <p class="auth-input-error" id="pwError" style="display:none;">비밀번호가 일치하지 않습니다.</p>
        </div>

        <div class="auth-field">
          <label class="auth-field-label" for="signupName">이름</label>
          <input
            type="text"
            id="signupName"
            class="auth-input login-input"
            placeholder="이름을 입력해 주세요"
            autocomplete="name"
          />
        </div>

        <div class="auth-field">
          <label class="auth-field-label" for="signupPhone">휴대폰 번호</label>
          <div class="auth-phone-row">
            <input
              type="tel"
              id="signupPhone"
              class="auth-input login-input"
              placeholder="- 없이 입력해 주세요"
              autocomplete="tel"
              maxlength="13"
            />
            <button type="button" class="btn-verify" id="btnVerify">인증요청</button>
          </div>
          <div id="verifyCodeWrap" style="display:none;">
            <input
              type="text"
              id="signupVerifyCode"
              class="auth-input login-input"
              placeholder="인증번호 6자리를 입력해주세요."
              maxlength="6"
            />
            <button type="button" class="btn-resend-hint" id="btnResendHint">인증번호를 받지 못하셨나요?</button>
          </div>
        </div>

        <!-- 약관 동의 -->
        <div class="signup-terms">
          <label class="signup-terms-all">
            <input type="checkbox" id="chkAll" />
            <span>필수 약관 모두 동의하기</span>
          </label>
          <div class="signup-terms-list">
            <div class="signup-terms-item">
              <label class="signup-terms-check">
                <input type="checkbox" id="chkTerms" />
                <span>이용약관에 동의합니다. <a href="https://spiky-quasar-2cc.notion.site/63e1da5a1487486c8b8011c69236a8d3" target="_blank" rel="noopener" class="signup-terms-view">(원문 보기)</a></span>
              </label>
            </div>
            <div class="signup-terms-item">
              <label class="signup-terms-check">
                <input type="checkbox" id="chkPrivacy" />
                <span>개인정보 처리방침에 동의합니다. <a href="https://spiky-quasar-2cc.notion.site/52b85331797c4d09a09201fde03115c8" target="_blank" rel="noopener" class="signup-terms-view">(원문 보기)</a></span>
              </label>
            </div>
          </div>
        </div>

        <div class="login-actions">
          <button type="button" class="btn-login-submit" id="btnSignup" disabled>동의하고 회원가입하기</button>
          <div class="login-footer-links">
            <div class="login-footer-left">
              <span>이미 계정이 있으신가요?</span>
              <a href="login.html">로그인</a>
            </div>
          </div>
        </div>

      </form>

    </div>
  </main>

  <!-- 인증번호 못 받음 팝업 -->
  <div class="verify-modal-overlay" id="verifyModalOverlay" style="display:none;">
    <div class="verify-modal">
      <div class="verify-modal-head">
        <p class="verify-modal-title">인증번호를 받지 못하셨다면<br/>아래 방법으로 다시 시도해주세요</p>
        <button type="button" class="verify-modal-close" id="btnVerifyModalClose">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M5 5l10 10M15 5L5 15" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div class="verify-modal-actions">
        <button type="button" class="verify-modal-btn verify-modal-btn--outline" id="btnReEnterPhone">휴대폰번호 다시 입력</button>
        <button type="button" class="verify-modal-btn verify-modal-btn--fill" id="btnResendCode">인증번호 다시 받기</button>
      </div>
    </div>
  </div>

  <script src="signup.js"></script>
  <script src="common-helper.js"></script>
</body>
</html>
