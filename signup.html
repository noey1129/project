<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회원가입 – 로싸인</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body class="page-auth">

  <header class="nav">
    <div class="nav__inner">
      <div class="nav__left">
        <a href="index.html" class="nav__logo"><img src="assets/Lawsign.svg" alt="Lawsign" height="22"></a>
      </div>
      <div class="nav__right">
        <a href="contact.html" class="nav__contact">서비스문의</a>
        <a href="login.html" class="nav__contact">로그인</a>
      </div>
    </div>
  </header>

  <main class="auth-main">
    <div class="auth-card">

      <div class="auth-header" style="align-items:flex-start;">
        <h1 class="auth-title">회원가입</h1>
      </div>

      <!-- 이메일 가입 폼 -->
      <form class="auth-form" id="signupForm" onsubmit="return false;">
        <input
          type="text"
          id="signupName"
          class="auth-input"
          placeholder="이름"
          autocomplete="name"
        />
        <input
          type="email"
          id="signupEmail"
          class="auth-input"
          placeholder="이메일"
          autocomplete="email"
        />
        <input
          type="tel"
          id="signupPhone"
          class="auth-input"
          placeholder="전화번호"
          autocomplete="tel"
          maxlength="13"
        />
        <input
          type="password"
          id="signupPassword"
          class="auth-input"
          placeholder="비밀번호 (8자 이상)"
          autocomplete="new-password"
        />
        <div>
          <input
            type="password"
            id="signupPasswordConfirm"
            class="auth-input"
            placeholder="비밀번호 확인"
            autocomplete="new-password"
          />
          <p class="auth-input-error" id="pwError" style="display:none;">비밀번호가 일치하지 않습니다.</p>
        </div>
      </form>

      <!-- 약관 동의 -->
      <div class="auth-checks">
        <label class="auth-check">
          <input type="checkbox" id="chkTerms" />
          <span><a href="#" onclick="return false;">이용약관</a>에 동의합니다. (필수)</span>
        </label>
        <label class="auth-check">
          <input type="checkbox" id="chkPrivacy" />
          <span><a href="#" onclick="return false;">개인정보 처리방침</a>에 동의합니다. (필수)</span>
        </label>
      </div>

      <button type="button" class="btn-auth-submit" id="btnSignup" disabled>회원가입</button>

      <!-- 하단 링크 -->
      <div class="auth-footer-link">
        <span>이미 계정이 있으신가요?</span>
        <a href="login.html">로그인</a>
      </div>

    </div>
  </main>

  <script src="signup.js"></script>
</body>
</html>
