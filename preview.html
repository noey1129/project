<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>문서 미리보기 – Sendit</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="lease-question.css" />
  <link rel="stylesheet" href="lease-preview.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;600;700;800&display=swap" rel="stylesheet" />

</head>
<body class="page-preview">

  <!-- ───────────────────────────── NAV ───────────────────────────── -->
  <header class="nav">
    <div class="nav__inner">
      <div class="nav__left">
        <a href="index.html" class="nav__logo">Sendit</a>
        <nav class="nav__links">
          <a href="index.html#hero"    class="nav__link nav__link--active">이용 상황</a>
          <a href="index.html#how"     class="nav__link">이용 방법</a>
          <a href="index.html#pricing" class="nav__link">가격</a>
          <a href="index.html#faq"     class="nav__link">자주 묻는 질문</a>
          <a href="index.html#trust"   class="nav__link">인증 및 문서</a>
          <a href="index.html#law"     class="nav__link">법 조항</a>
        </nav>
      </div>
      <div class="nav__right">
        <a href="contact.html" class="nav__contact">서비스문의</a>
        <button class="btn btn--dark" onclick="window.location.href='login.html'">로그인</button>
      </div>
    </div>
  </header>

  <!-- ───────────────────────────── MAIN ───────────────────────────── -->
  <main class="preview-main">

    <div class="preview-header">
      <h1 class="preview-title">미리보기</h1>
      <p class="preview-sub">입력하신 내용으로 작성된 문서입니다. 확인 후 발송하세요.</p>
    </div>

    <!-- 에디터 카드 -->
    <div class="preview-card">

      <!-- 툴바 -->
      <div class="doc-toolbar">

        <!-- 발송 방식 뱃지 -->
        <div class="doc-method-wrap">
          <span class="doc-method-badge" id="methodBadge"></span>
          <span class="doc-method-notice" id="methodNotice"></span>
        </div>

        <!-- 액션 버튼 -->
        <div class="doc-actions">
          <button class="doc-action-btn doc-action-btn--icon" id="btnPlus" title="글자 크게">
            <img src="assets/plus.png" width="18" height="18" alt="크게" />
          </button>
          <button class="doc-action-btn doc-action-btn--icon" id="btnMinus" title="글자 작게">
            <img src="assets/minus.png" width="18" height="18" alt="작게" />
          </button>
          <button class="doc-action-btn" id="btnPdf">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1C1E21" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
            </svg>
            PDF 다운로드
          </button>
          <button class="doc-action-btn doc-action-btn--save" id="btnSave" disabled>수정완료</button>
        </div>

      </div>

      <!-- 문서 뷰어 -->
      <div class="doc-viewer" id="docViewer">

        <div class="doc-paper">

          <div class="doc-heading">내 용 증 명</div>

          <table class="doc-table">
            <colgroup>
              <col class="col-role" />
              <col class="col-sublabel" />
              <col class="col-content" />
              <col class="col-sublabel" />
              <col class="col-content" />
            </colgroup>
            <tbody>

              <!-- 발신인 -->
              <tr>
                <td class="doc-role-label" rowspan="2">
                  발신인
                  <span class="doc-role-sub">(보내는 사람)</span>
                </td>
                <td class="doc-sublabel">성명</td>
                <td class="doc-field-cell">
                  <input type="text" id="senderName" class="doc-input" placeholder="성명을 입력해주세요." />
                </td>
                <td class="doc-sublabel">전화번호</td>
                <td class="doc-field-cell">
                  <input type="text" id="senderPhone" class="doc-input" placeholder="전화번호를 입력해주세요." />
                </td>
              </tr>
              <tr>
                <td class="doc-sublabel">주소</td>
                <td class="doc-field-cell doc-field-cell--addr" colspan="3">
                  <div class="doc-addr-wrap">
                    <input type="text" id="senderAddr" class="doc-input doc-input--addr" placeholder="주소를 입력해주세요." />
                    <input type="text" id="senderAddrDetail" class="doc-input doc-input--detail" placeholder="상세주소" />
                  </div>
                </td>
              </tr>

              <!-- 수신인 -->
              <tr>
                <td class="doc-role-label" rowspan="2">
                  수신인
                  <span class="doc-role-sub">(받는 사람)</span>
                </td>
                <td class="doc-sublabel">성명</td>
                <td class="doc-field-cell">
                  <input type="text" id="recipientName" class="doc-input" placeholder="성명을 입력해주세요." />
                </td>
                <td class="doc-sublabel">전화번호</td>
                <td class="doc-field-cell">
                  <input type="text" id="recipientPhone" class="doc-input" placeholder="전화번호를 입력해주세요." />
                </td>
              </tr>
              <tr id="recipientBirthRow" style="display:none;">
                <td class="doc-sublabel">생년월일</td>
                <td class="doc-field-cell" colspan="3">
                  <input type="text" id="recipientBirth" class="doc-input" placeholder="8자리 (예: 19900101)" maxlength="8" />
                </td>
              </tr>

              <!-- 내용 -->
              <tr>
                <td class="doc-content-label" colspan="5">내 용</td>
              </tr>
              <tr>
                <td class="doc-content-body" colspan="5">
                  <textarea id="docContent" class="doc-textarea"></textarea>
                </td>
              </tr>

            </tbody>
          </table>

        </div><!-- /.doc-paper -->

      </div><!-- /.doc-viewer -->

    </div><!-- /.preview-card -->

  </main>

  <!-- ───────────────────────────── BOTTOM BAR ───────────────────────────── -->
  <div class="bottom-bar">
    <div class="bottom-bar__inner">
      <button class="btn-prev" id="btnPrev">이전</button>
      <button class="btn-next" id="btnSend" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 6px;">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
        문서 발송하기
      </button>
    </div>
  </div>

  <script src="preview.js"></script>
</body>
</html>
