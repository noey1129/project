<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>계약관련 질문 – Sendit</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="lease-question.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet" />
</head>
<body class="page-question">

  <header class="nav">
    <div class="nav__inner">
      <div class="nav__left">
        <a href="index.html" class="nav__logo">Sendit</a>
        <nav class="nav__links">
          <a href="index.html#hero"    class="nav__link nav__link--active">이용 상황</a>
          <a href="index.html#how"     class="nav__link">이용 방법</a>
          <a href="index.html#pricing" class="nav__link">가격</a>
          <a href="index.html#faq"     class="nav__link">자주 묻는 질문</a>
          <a href="index.html#trust"   class="nav__link">인증 및 문서</a>
          <a href="index.html#law"     class="nav__link">법 조항</a>
        </nav>
      </div>
      <div class="nav__right">
        <a href="#" class="nav__contact">서비스문의</a>
        <button class="btn btn--dark">로그인</button>
      </div>
    </div>
  </header>

  <main class="question-main">
    <div class="question-wrap">

      <div class="question-header">
        <h1 class="question-title">계약 분쟁 상황을 설명해 주세요.</h1>
        <p class="question-sub">어떤 계약이며 어떤 문제가 발생했는지 적어 주세요.</p>
      </div>

      <div class="question-body">

        <div class="progress-row">
          <div class="progress-bar">
            <div class="progress-bar__fill" style="width: calc(1 / 4 * 100%)"></div>
          </div>
          <div class="progress-counter">
            <span class="progress-counter__current">1</span>
            <span class="progress-counter__sep">/</span>
            <span class="progress-counter__total">4</span>
          </div>
        </div>

        <div class="answer-list answer-list--form">
          <div class="answer-form-group">
            <textarea class="answer-form-textarea" id="situation"
              placeholder="예: 2024년 3월에 인테리어 공사 계약을 체결하였으나, 공사 기간이 지나도록 착공조차 하지 않고 있습니다."
              rows="6"></textarea>
          </div>
        </div>

      </div>
    </div>
  </main>

  <div class="bottom-bar">
    <div class="bottom-bar__inner">
      <button class="btn-prev" id="btnPrev">이전</button>
      <button class="btn-next" id="btnNext" disabled>다음</button>
    </div>
  </div>

  <script src="contract-q1.js"></script>
</body>
</html>
